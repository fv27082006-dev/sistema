<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONTROL COMERCIAL · Sistema</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --ink:#0f1b2d; --muted:#5b6b82; --line:#e3e8ef;
  --brand:#0b3d6e; --brand-2:#0e7c86; --accent:#14a37f; --warn:#c77700; --bad:#c2352b;
  --soft:#eef4fb; --radius:12px; --shadow:0 1px 2px rgba(15,27,45,.06),0 4px 16px rgba(15,27,45,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--brand);color:#dce8f5;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#19b394,#0e7c86);display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px;letter-spacing:.5px}
.brand b{display:block;color:#fff;font-size:13px;letter-spacing:.8px}
.brand small{color:#9fb6cf;font-size:11px}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#cfdeee;text-decoration:none;font-weight:500}
nav a svg{width:18px;height:18px;flex:none}
nav a:hover{background:rgba(255,255,255,.07)}
nav a.on{background:#fff;color:var(--brand)}
.side-foot{margin-top:auto;font-size:11px;color:#8fa8c3;padding:8px}
main{padding:22px 26px 90px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{padding:14px 16px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-.3px}
.kpi .h{font-size:12px;color:var(--muted);margin-top:4px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c5d0de}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.g{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.d{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;outline:none}
.in:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(14,124,134,.12)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.sec{font-size:12px;font-weight:700;color:var(--brand-2);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 10px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#f8fafc}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--soft);color:var(--brand)}
.tag.int{background:#eef1f5;color:#44546a}
.tag.fis{background:#e3f6f0;color:#0b7a5c}
.tag.bad{background:#fdeceb;color:var(--bad)}
.tag.warn{background:#fff4e2;color:var(--warn)}
.muted{color:var(--muted)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:13px}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.scroll{overflow-x:auto}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:14px;align-items:start}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;margin-top:10px;max-height:calc(100vh - 300px);overflow:auto;padding-bottom:4px;align-content:start}
.posbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--brand);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:14px}
.posbar .pb-l,.posbar .pb-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pb-t{font-size:15px;margin-right:4px}
.pchip{background:rgba(255,255,255,.13);color:#fff;border:0;border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer;width:auto}
select.pchip{padding:6px 8px}select.pchip option{color:#0f1b2d}
.pchip.warn{background:#fff4e0;color:#7a4700;font-weight:600}
.pchip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:6px}
.posbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.psearch{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--brand-2);border-radius:12px;padding:0 14px;height:50px}
.psearch svg{width:20px;height:20px;color:var(--brand-2);flex:none}
.psearch input{border:0;outline:0;font:inherit;font-size:15px;flex:1;background:transparent;min-width:0}
.psearch span{font-size:12px;white-space:nowrap}
.pcats{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.pcats button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.pcats button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.pimg{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.ptag{background:#b42318;color:#fff;border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:700;margin-right:24px}
.pfoot{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:8px;font-size:11.5px}
.pfoot .pr{margin:0;font-size:14px}
.ok{color:#0d6b47}.warn{color:#8a5200}.bad{color:#b42318;font-weight:600}
.pitem.none{opacity:.65}
.pkeys{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.ccard{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe}
.cav{width:38px;height:38px;border-radius:10px;background:#eef4fb;color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none;font-size:13px}
.ptot{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.ptot .tot{padding:2px 0;font-size:13px}
.pbtns{display:grid;grid-template-columns:auto auto 1fr;gap:8px;margin-top:12px}.pbtns .btn{justify-content:center;height:48px;min-width:0;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtns .btn.g{font-size:15px;font-weight:700}
.cpick{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);min-height:440px}
.cp-l{padding:16px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.cp-r{padding:16px 18px;background:#fbfcfe}
.cp-list{flex:1;overflow:auto;max-height:52vh;margin-top:10px;border:1px solid var(--line);border-radius:10px}
.cp-it{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid #eef1f5;background:#fff;padding:10px 12px;font:inherit;color:inherit;cursor:pointer}
.cp-it.on{background:#eef4fb}
.cp-kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.cp-kpi div{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px}.cp-kpi span{display:block;font-size:12px;color:var(--muted)}
@media(max-width:1100px){.pos{grid-template-columns:1fr}.cpick{grid-template-columns:1fr}.cp-l{border-right:0}}
.pitem{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;text-align:left}
.pitem:hover{border-color:var(--brand-2)}
.pitem b{display:block;font-size:13px;line-height:1.3}
.pitem .pr{font-weight:700;margin-top:8px}
.pitem .st{font-size:11px;color:var(--muted);margin-top:2px}
.cart{position:sticky;top:16px}
.pos .cart{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.clines{margin-top:8px;flex:1 1 auto;overflow:auto;min-height:90px}
.cl-r{display:flex;align-items:center;gap:8px}.cl-t{font-weight:700;min-width:84px;text-align:right}
@media(max-width:1100px){.pos .cart{max-height:none}.clines{overflow:visible}}
.doc-switch{display:grid;grid-template-columns:1fr 1fr;background:#eef1f5;border-radius:10px;padding:4px;gap:4px}
.doc-switch button{border:0;background:transparent;padding:9px;border-radius:8px;font-weight:600;cursor:pointer;color:#44546a}
.doc-switch button.on{background:#fff;box-shadow:var(--shadow);color:var(--ink)}
.doc-switch button.on.fis{color:#0b7a5c}
.cline{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px 0;border-bottom:1px dashed var(--line)}
.cline .nm{font-weight:600;font-size:13px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700}
.qty input{width:52px;text-align:center;padding:5px}
.tot{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted)}
.tot.big{color:var(--ink);font-size:20px;font-weight:700;padding-top:8px}
/* modal */
.mb{position:fixed;inset:0;background:rgba(15,27,45,.45);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow:auto}
.mb.on{display:flex}
.modal{background:#fff;border-radius:14px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{width:min(1000px,100%)}
.fmtsel{display:flex;gap:4px;background:#eef2f7;border-radius:10px;padding:3px;margin:0 auto 12px;max-width:420px}.fmtsel button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 6px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}.fmtsel button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(15,27,45,.15)}
.cprev{overflow:auto;background:#eef2f7;border-radius:10px;padding:12px}.cprev .carta{width:760px;margin:0 auto;box-shadow:0 2px 10px rgba(15,27,45,.12)}
.carta{background:#fff;color:#111;font-family:Inter,Arial,sans-serif;font-size:12px;padding:28px 32px;line-height:1.45}
.carta .ch{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #0b3d6e;padding-bottom:12px}.carta .cn{font-size:18px;font-weight:800;color:#0b3d6e}
.carta .cbox{text-align:right;min-width:230px}.carta .ct{font-size:17px;font-weight:800;letter-spacing:.04em}.carta .cs{color:#555}.carta .cnum{font-weight:700;margin-top:2px}.carta .cfis{margin-top:6px;font-size:11px;color:#333;border:1px solid #ccd;border-radius:6px;padding:6px 8px;text-align:left}.carta .ccopy{margin-top:6px;font-weight:800;color:#0b3d6e}
.carta .cparty{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin:14px 0}.carta .cparty span{color:#555;margin-right:6px}.carta .cparty span::after{content:':'}
.carta .ctab{width:100%;border-collapse:collapse;margin-top:6px}.carta .ctab th{background:#0b3d6e;color:#fff;text-align:left;padding:6px 8px;font-size:11px}.carta .ctab td{border-bottom:1px solid #e3e6ea;padding:6px 8px;vertical-align:top}.carta .n{text-align:right;white-space:nowrap}.carta .cx{font-size:11px;color:#555}
.carta .cfoot{display:flex;justify-content:space-between;gap:20px;margin-top:12px}.carta .cnotes{flex:1}.carta .ctot{min-width:280px;border-collapse:collapse}.carta .ctot td{padding:3px 8px}.carta .ctot tr.big td{font-weight:800;font-size:14px;border-top:2px solid #0b3d6e}.carta .cvoid{color:#b42318;font-weight:800;margin-top:8px}
.carta .csig{display:flex;justify-content:space-around;gap:30px;margin-top:56px;text-align:center}.carta .csig>div{flex:1;max-width:240px}.carta .cl{border-top:1px solid #333;margin-bottom:4px}.carta .cfootnote{text-align:center;margin-top:22px;color:#444;font-size:11px}
@media print{body.pr-carta>*:not(#printBox){display:none!important}body.pr-carta #printBox{display:block}body.pr-carta #printBox .carta{padding:0;box-shadow:none;width:auto}@page{margin:12mm}body.pr-copies #printBox .ticket.t58{width:48mm!important;font-size:9px!important}}
@media print{body.pr-rep *{visibility:hidden}body.pr-rep #repArea,body.pr-rep #repArea *{visibility:visible}body.pr-rep #repArea{position:absolute;left:0;top:0;width:100%}body.pr-rep .noprint{display:none!important}}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.rgrid button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;color:var(--ink)}.rgrid button b{display:block;font-size:13.5px}.rgrid button span{font-size:12px;color:var(--muted)}.rgrid button.on{border:2px solid var(--brand);background:#eef4fb}
button.card{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line)}button.card.acc.on{border:2px solid var(--brand);box-shadow:0 0 0 3px rgba(11,61,110,.08)}
.kpis{display:grid;gap:10px}.kpi>span{display:block;color:var(--muted);font-size:12px}.kpi>b{display:block;font-size:18px;margin-top:4px;letter-spacing:-.2px}
.bfBody .kpi,#bfBody .kpi{background:#fff;border:1px solid var(--line);border-radius:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.bfil{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}@media(max-width:700px){.bfil{grid-template-columns:1fr 1fr}.bfil>div[style]{grid-column:1/-1!important}}
.modal.sm{width:min(460px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:16px}
.mbody{padding:18px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;z-index:60;display:none;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}
.banner{padding:10px 14px;border-radius:10px;background:#fff4e2;color:#7a4b00;margin-bottom:14px;font-size:13px}
.banner.info{background:var(--soft);color:var(--brand)}
.shr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 18px 12px}.shr .btn{justify-content:center}@media(max-width:560px){.shr{grid-template-columns:1fr 1fr}}
.tlogo{display:block;margin:0 auto 8px;max-width:70%;max-height:90px;object-fit:contain}.clogo{display:block;max-width:210px;max-height:72px;object-fit:contain;margin-bottom:6px}.logoBox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.logoPrev{width:180px;height:80px;border:1px dashed #cfd6df;border-radius:10px;display:grid;place-items:center;background:#fff;overflow:hidden;color:#8a94a3;font-size:12px}.logoPrev img{max-width:100%;max-height:100%;object-fit:contain}
.ticket{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:#fbfbf9;border:1px dashed #cfd6df;border-radius:10px;padding:16px;white-space:pre-wrap;line-height:1.45;max-width:380px;margin:0 auto}
@media(max-width:560px){.ticket{font-size:2.8vw;padding:10px 8px}}
.unitrow{display:grid;grid-template-columns:1.4fr .8fr 1fr 1.2fr auto;gap:8px;margin-bottom:8px}
.chk{display:flex;align-items:center;gap:8px;font-weight:500}
.mobnav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  main{padding:16px 14px 92px}
  .pos{grid-template-columns:1fr}
  .cart{position:static}
  .plist{max-height:none}
  .mobnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mobnav a{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);text-decoration:none;padding:4px 2px;font-weight:600}
  .mobnav a svg{width:21px;height:21px}
  .mobnav a.on{color:var(--brand)}
  .unitrow{grid-template-columns:1fr 1fr}
  .hide-m{display:none}
}

/* ===== Shell v2: menú por grupos + barra superior ===== */
.app{grid-template-columns:248px 1fr;transition:grid-template-columns .15s}
.app.collapsed{grid-template-columns:72px 1fr}
aside{background:#0a2540;padding:14px 12px;overflow-y:auto}
.brand{padding:4px 6px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
nav{display:flex;flex-direction:column;gap:2px}
nav a,.ngroup{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#c7d6e6;text-decoration:none;font-weight:500;border:0;background:transparent;width:100%;text-align:left;cursor:pointer;font-size:14px}
nav a:hover,.ngroup:hover{background:rgba(255,255,255,.06);color:#fff}
nav a.on{background:#2a78d6;color:#fff}
nav a.sub{padding:8px 12px 8px 41px;font-size:13.5px;color:#a9bdd3}
nav a.sub.on{background:rgba(42,120,214,.22);color:#fff}
.ngroup .chev{margin-left:auto;transition:transform .15s;width:14px;height:14px}
.ngroup.open .chev{transform:rotate(180deg)}
.nsep{height:1px;background:rgba(255,255,255,.08);margin:8px 4px}
.collapse{margin-top:auto;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#8fa8c3;padding:10px 12px;cursor:pointer;font-weight:500;border-top:1px solid rgba(255,255,255,.08);border-radius:0}
.collapse svg{width:16px;height:16px}
.app.collapsed .lbl,.app.collapsed .brand div:last-child,.app.collapsed .side-foot,.app.collapsed .chev,.app.collapsed nav a.sub{display:none}
.app.collapsed .collapse svg{transform:rotate(180deg)}
.side-foot{padding:6px 12px 0}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 22px;min-height:62px}
.iconbtn{position:relative;border:0;background:transparent;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:#44546a}
.iconbtn:hover{background:#f1f4f8}
.backbtn{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:10px;height:38px;padding:0 12px 0 8px;font:inherit;font-size:13.5px;font-weight:600;color:#24476e;cursor:pointer;flex:none;max-width:200px}

const FISCAL_DOCS = { fiscal: { name: 'Factura', defType: '01' }, fiscalNC: { name: 'Nota de crédito', defType: '06' }, fiscalND: { name: 'Nota de débito', defType: '07' } };

// Avisos de cada rango: por agotarse (≤ 50 números o ≤ 10 %) y fecha límite cercana (≤ 15 días)
function fiscalWarnings(cfg) {
  const out = [];
  for (const [k, d] of Object.entries(FISCAL_DOCS)) {
    const f = cfg[k] || {}; if (!f.cai) continue;
    const fp = fiscalProblem(cfg, k); if (fp) { out.push({ key: k, tone: 'bad', t: d.name + ' SAR', d: fp }); continue; }
    const left = fiscalLeft(f); const size = Math.max(1, Number(f.to) - Number(f.from) + 1);
    if (left <= 50 || left / size <= 0.1) out.push({ key: k, tone: 'warn', t: `Rango de ${d.name.toLowerCase()} por agotarse`, d: `Quedan ${left} números (hasta ${fiscalNumber(f, f.to)}).` });
    const days = daysBetween(today(), f.deadline);
    if (days <= 15) out.push({ key: k, tone: 'warn', t: `CAI de ${d.name.toLowerCase()} por vencer`, d: `La fecha límite de emisión es el ${fdate(f.deadline + 'T12:00:00')} (${days === 0 ? 'hoy' : days === 1 ? 'mañana' : 'en ' + days + ' días'}).` });
  }

}

}

// Paleta categórica validada (orden fijo; el color sigue a la categoría)
const SERIES = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#6250d6'];
const PREV_GRAY = '#9aa6b5';
const CLASS_ORDER = ['Consumidor final', 'Minorista', 'Mayorista', 'Distribuidor', 'Preferencial', 'Sin clasificar'];
const CLASS_COLOR = { 'Consumidor final': SERIES[0], Minorista: SERIES[1], Mayorista: SERIES[2], Distribuidor: SERIES[3], Preferencial: SERIES[4], 'Sin clasificar': '#9aa6b5' };

const PERIODS = { hoy: 'Hoy', d7: 'Últimos 7 días', mes: 'Este mes', mesant: 'Mes anterior', d30: 'Últimos 30 días' };
let dashPeriod = 'mes';

const addDays = (k, n) => new Date(Date.parse(k + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
const firstOfMonth = (k) => k.slice(0, 8) + '01';
const prevMonth = (k) => { const d = new Date(Date.parse(firstOfMonth(k) + 'T00:00:00Z')); d.setUTCMonth(d.getUTCMonth() - 1); return d.toISOString().slice(0, 10); };
const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const shortDay = (k) => `${Number(k.slice(8))} ${MONTHS[Number(k.slice(5, 7)) - 1]}`;
const hourOf = (iso) => Number(new Date(iso).toLocaleString('en-US', { timeZone: tz, hour: '2-digit', hourCycle: 'h23' }));

function periodRange(key) {
  const t = today();
  let a, b, pa, pb;
  if (key === 'hoy') { a = t; b = addDays(t, 1); pa = addDays(t, -1); pb = t; }
  else if (key === 'd7' || key === 'd30') { const n = key === 'd7' ? 7 : 30; a = addDays(t, -(n - 1)); b = addDays(t, 1); pa = addDays(a, -n); pb = a; }
  else if (key === 'mes') { a = firstOfMonth(t); b = addDays(t, 1); pa = prevMonth(t); pb = addDays(pa, Math.min(daysBetween(a, b), daysBetween(pa, a))); }
  else { a = prevMonth(t); b = firstOfMonth(t); pa = prevMonth(a); pb = a; }
  return { a, b, pa, pb, hourly: key === 'hoy' };
}
const inR = (iso, a, b) => { const k = dayKey(iso); return k >= a && k < b; };
function periodMetrics(a, b) {
  const sales = S.sales.filter(s => s.status === 'issued' && inR(s.createdAt, a, b));

  const cashIn = r2(sales.reduce((x, s) => x + (s.tenders || []).filter(t => t.method !== 'credit').reduce((y, t) => y + t.amount, 0), 0)
    + S.payments.filter(p => inR(p.createdAt, a, b)).reduce((x, p) => x + p.amount, 0));
  const withCost = sales.filter(s => !s.hasMissingCost);
  const profit = r2(withCost.reduce((x, s) => x + (s.subtotal - (s.costTotal || 0)), 0));
  return { sales, total, cashIn, profit, missing: sales.length - withCost.length, count: sales.length,
    fiscal: sales.filter(s => s.kind === 'fiscal').length, internal: sales.filter(s => s.kind === 'internal').length };
}
function delta(cur, prev) {
  if (!prev) return `<span class="d">Sin datos del período anterior</span>`;
  const p = (cur - prev) / Math.abs(prev) * 100;
  const up = p >= 0;
  return `<span class="d"><span class="${up ? 'up' : 'down'}">${up ? '↗' : '↘'} ${up ? '+' : ''}${p.toFixed(1)} %</span> vs período anterior</span>`;
}
function niceMax(v) { if (v <= 0) return 100; const e = Math.pow(10, Math.floor(Math.log10(v))); const m = v / e; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * e; }
const Lk = (n) => n >= 1e6 ? 'L ' + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M' : n >= 1e3 ? 'L ' + (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + 'k' : 'L ' + Math.round(n);

function lineChart(labels, cur, prev, tipLabels) {
  const W = 680, H = 250, l = 58, r = 30, t = 14, bm = 30;
  const max = niceMax(Math.max(...cur, ...prev, 0));
  const n = labels.length, iw = W - l - r, ih = H - t - bm;
  const X = (i) => l + (n === 1 ? iw / 2 : i * iw / (n - 1));
  const Y = (v) => t + ih - (v / max) * ih;
  const path = (arr) => arr.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join('');
  const ticks = [0, .25, .5, .75, 1].map(f => f * max);
  const step = Math.max(1, Math.ceil(n / 7));
  const area = path(cur) + `L${X(n - 1)} ${t + ih}L${X(0)} ${t + ih}Z`;
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de ventas">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2a78d6" stop-opacity=".16"/><stop offset="1" stop-color="#2a78d6" stop-opacity="0"/></linearGradient></defs>`;
  ticks.forEach(v => { g += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef1f5"/><text x="${l - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#6b7a90">${Lk(v)}</text>`; });
  labels.forEach((lb, i) => { if ((i % step === 0 && n - 1 - i >= Math.max(2, step)) || i === n - 1) g += `<text x="${X(i)}" y="${H - 8}" text-anchor="${i === n - 1 && n > 1 ? 'end' : 'middle'}" font-size="11" fill="#6b7a90">${lb}</text>`; });
  g += `<path d="${area}" fill="url(#ga)"/>`;
  g += `<path d="${path(prev)}" fill="none" stroke="${PREV_GRAY}" stroke-width="2" stroke-dasharray="5 5"/>`;
  g += `<path d="${path(cur)}" fill="none" stroke="#2a78d6" stroke-width="2.25" stroke-linejoin="round"/>`;
  if (n <= 31) cur.forEach((v, i) => { g += `<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="#2a78d6" stroke="#fff" stroke-width="2"/>`; });
  g += `<line id="xh" x1="0" x2="0" y1="${t}" y2="${t + ih}" stroke="#9aa6b5" stroke-dasharray="3 3" visibility="hidden"/>`;
  const hw = n === 1 ? iw : iw / (n - 1);

  g += `</svg>`;
  return { svg: g, tip: (i) => `<b>${tipLabels[i]}</b><br><span style="color:#8fc0f5">●</span> Período actual: ${L(cur[i])}<br><span style="color:#c3cbd6">●</span> Período anterior: ${L(prev[i])}` };
}
function barChart(labels, vals, tipLabels) {
  const W = 680, H = 250, l = 58, r = 14, t = 14, bm = 30;
  const max = niceMax(Math.max(...vals, 0));
  const n = labels.length, iw = W - l - r, ih = H - t - bm, slot = iw / n, bw = Math.min(46, slot * 0.56);
  const Y = (v) => t + ih - (v / max) * ih;

  [0, .25, .5, .75, 1].forEach(f => { const v = f * max; g += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef1f5"/><text x="${l - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#6b7a90">${Lk(v)}</text>`; });

function donut(segs, centerTop, centerVal) {

const POS = { lines: [], customerId: WALK_IN, kind: null, query: '', wh: '', cat: '', address: null };
/* ---- Terminales: cada computadora o tablet se asigna a una terminal (bodega, caja, documento) ---- */
const TERM_KEY = 'cc_terminal';
const cfgTerminals = () => (S.config.terminals || []).filter(t => t.active !== false);
function curTerminal() { const id = LS.getItem(TERM_KEY); return cfgTerminals().find(t => t.id === id) || null; }
const posWh = () => { const t = curTerminal(); if (t && cfgWarehouses().includes(t.wh)) return t.wh; return (POS.wh && cfgWarehouses().includes(POS.wh)) ? POS.wh : (S.config.posWarehouse && cfgWarehouses().includes(S.config.posWarehouse) ? S.config.posWarehouse : mainWh()); };
/* ---- Ventas suspendidas (en esta terminal, vencen a las 24 h) ---- */
const HOLD_KEY = 'cc_pos_holds';
function holds() { let a = []; try { a = JSON.parse(LS.getItem(HOLD_KEY) || '[]'); } catch (e) { a = []; } const ok = a.filter(h => Date.now() - Date.parse(h.at) < 864e5); if (ok.length !== a.length) setHolds(ok); return ok; }
function setHolds(a) { try { LS.setItem(HOLD_KEY, JSON.stringify(a)); } catch (e) { toast('No se pudo guardar la venta suspendida en este equipo.', true); } }
function resetPos() { POS.lines = []; POS.customerId = WALK_IN; POS.kind = null; POS.address = null; POS.exchange = null; POS.exoOc = ''; }
function suspendSale(silent) {
  if (!POS.lines.length) return toast('No hay productos para suspender.', true);
  let n = Number(LS.getItem('cc_pos_hold_n') || 0) + 1; LS.setItem('cc_pos_hold_n', String(n));
  const cs = curSession(); const t = cartTotals(POS.lines);
  const h = { id: uid(), number: 'S-' + pad(n, 4), at: nowIso(), terminal: (curTerminal() || {}).code || '', cashier: cs ? cs.cashier : '', customerId: POS.customerId, kind: POS.kind, address: POS.address, lines: clone(POS.lines), total: t.total, items: r4(POS.lines.reduce((a, l) => a + l.qty, 0)) };
  setHolds([h, ...holds()]); resetPos();
  if (!silent) { toast(`Venta suspendida (${h.number}). Recupérela con F7.`); render(); }
  return h;
}
function recoverDialog() {
  const list = holds();
  openModal(`<div class="mh"><h2>Ventas suspendidas</h2><button class="x" data-close>×</button></div>
  <div class="mbody">${list.length ? `<div class="scroll"><table><thead><tr><th>Número</th><th>Hora</th><th>Cliente</th><th class="num">Artículos</th><th class="num">Total</th><th></th></tr></thead><tbody>${list.map(h => `<tr><td><b>${esc(h.number)}</b><div class="muted" style="font-size:12px">${esc(h.cashier || '')}</div></td><td>${fdt(h.at)}</td><td>${esc((S.customers.get(h.customerId) || {}).name || 'Consumidor final')}</td><td class="num">${qfmt(h.items)}</td><td class="num"><b>${L(h.total)}</b></td>
    <td class="num" style="white-space:nowrap"><button class="btn sm p" data-rec="${h.id}">Recuperar</button> <button class="btn sm d" data-drop="${h.id}">Descartar</button></td></tr>`).join('')}</tbody></table></div>
    <p class="sub">Se guardan en este equipo y se descartan solas después de 24 horas.</p>` : '<div class="empty">No hay ventas suspendidas.</div>'}</div>`);
  bindClose();
  $('#modal').querySelectorAll('[data-rec]').forEach(b => b.onclick = () => {
    const h = holds().find(x => x.id === b.dataset.rec); if (!h) return;

    const lines = h.lines.filter(l => S.products.get(l.productId)); const lost = h.lines.length - lines.length;
    POS.lines = lines; POS.customerId = S.customers.get(h.customerId) ? h.customerId : WALK_IN; POS.kind = h.kind; POS.address = h.address ?? null;
    setHolds(holds().filter(x => x.id !== h.id)); closeModal(); render();
    toast(`Venta ${h.number} recuperada.${lost ? ` ${lost} producto(s) ya no existen y se quitaron.` : ''}${note}`);
  });
  $('#modal').querySelectorAll('[data-drop]').forEach(b => b.onclick = () => { const h = holds().find(x => x.id === b.dataset.drop); confirmBox('Descartar venta suspendida', `Se elimina ${h ? h.number : ''}. No afecta inventario ni caja.`, 'Descartar', () => { setHolds(holds().filter(x => x.id !== b.dataset.drop)); recoverDialog(); render(); }); });
}

function validateSale(kind, customer, lines, tenders, whArg) {
  const cfg = S.config; const W = whArg || posWh();
  if (!lines.length) return 'La venta no tiene productos.';
  if (kind === 'internal' && cfg.internalEnabled === false) return 'La venta interna está deshabilitada en Configuración.';
  if (kind === 'fiscal') { const fp = fiscalProblem(cfg); if (fp) return fp; }
  // Existencias (en unidad base, sumando presentaciones del mismo producto)
  if (!cfg.allowNegative) {
    const need = new Map();
    for (const l of lines) {
      const p = S.products.get(l.productId); if (!p || p.kind === 'service') continue;
      const u = unitById(p, l.unitId);
      need.set(p.id, r4((need.get(p.id) || 0) + l.qty * u.factor));
    }
    for (const g of cartGifts(lines)) { const gp = S.products.get(g.productId); if (gp && gp.kind !== 'service') need.set(g.productId, r4((need.get(g.productId) || 0) + g.qtyBase)); }
    for (const [pid, q] of need) {
      const p = S.products.get(pid);
      const av = availableOf(pid, W, customer && customer.id);
      if (av < q) return `Existencia insuficiente de "${p.name}" en ${W}: hay ${qfmt(av)} disponibles${reservedOf(pid, W, customer && customer.id) ? ' (el resto está reservado)' : ''}, se necesitan ${qfmt(q)}.`;
    }
  }
  const cst = customer ? custStatus(customer) : 'active';
  if (cst === 'inactive' || cst === 'suspended' || cst === 'pending') return `El cliente "${customer.name}" está ${STATUSES[cst][0].toLowerCase()}; no puede comprar.`;
  const credit = r2(tenders.filter(t => t.method === 'credit').reduce((a, t) => a + t.amount, 0));
  if (credit > 0) {
    if (!customer || customer.walkIn) return 'Para vender al crédito seleccione un cliente registrado.';
    if (!customer.creditEnabled) return `El cliente "${customer.name}" no tiene crédito habilitado.`;
    if (cst === 'blocked') return `El crédito de "${customer.name}" está bloqueado; solo puede comprar al contado.`;
    const avail = r2(Number(customer.creditLimit || 0) - customerBalance(customer.id));
    if (credit > avail) return `El crédito disponible de "${customer.name}" es ${L(avail)}; esta venta pide ${L(credit)}.`;
  }
  return null;
}

// Liquida el saldo a favor de un cambio: lo usado en la nueva venta y lo que sobra se devuelve en efectivo
async function settleExchange(used, sale) {
  const ex = POS.exchange; if (!ex) return 0; const r = clone(S.customerReturns.find(x => x.id === ex.returnId)); const left = r2(ex.amount - used);
  r.exchangeUsed = r2((r.exchangeUsed || 0) + used); r.exchangeOpen = 0; if (sale) r.exchangeSaleId = sale.id;
  if (left > 0.004) r.changeRefunds = [...(r.changeRefunds || []), { amount: left, at: nowIso(), sessionId: curSession() ? curSession().id : null }];
  await put('customerReturns', r); POS.exchange = null; return left;
}
function openPayment() {
  if (S.config.requireCash !== false && !curSession()) { toast('Abra la caja antes de cobrar.', true); return openCashForm(); }
  const t = cartTotals(POS.lines);
  const cust = S.customers.get(POS.customerId);
  const up = cust && !cust.walkIn ? cust.usualPayment : 'cash';
  const first = up === 'credit' && cust.creditEnabled && custStatus(cust) === 'active' ? 'credit' : (['card', 'transfer', 'deposit'].includes(up) ? up : 'cash');
  const ex = POS.exchange && POS.exchange.customerId === POS.customerId ? POS.exchange : null;
  const exAmt = ex ? r2(Math.min(ex.amount, t.total)) : 0;
  const tenders = ex ? [{ method: 'exchange', amount: exAmt, ref: ex.number }, ...(t.total - exAmt > 0.004 ? [{ method: first, amount: r2(t.total - exAmt) }] : [])] : [{ method: first, amount: t.total }];
  let received = '';
  const draw = () => {
    const paid = r2(tenders.reduce((a, x) => a + (Number(x.amount) || 0), 0));
    const cashAmt = r2(tenders.filter(x => x.method === 'cash').reduce((a, x) => a + (Number(x.amount) || 0), 0));
    const change = received !== '' ? r2(Number(received) - cashAmt) : 0;
    openModal(`<div class="mh"><h2>Cobrar · ${POS.kind === 'fiscal' ? 'Factura SAR' : 'Venta interna'}</h2><button class="x" data-close>×</button></div>
      <div class="mbody">
        <div class="tot big" style="padding-top:0"><span>Total a cobrar</span><span>${L(t.total)}</span></div>
        <div class="sub" style="margin-bottom:12px">Cliente: ${esc(cust?.name || 'Consumidor final')}</div>
        ${tenders.map((x, i) => `<div class="row" style="margin-bottom:8px">
          <select class="in" data-m="${i}" style="flex:1" ${x.method === 'exchange' ? 'disabled' : ''}>${Object.entries(METHODS).filter(([k]) => k !== 'exchange' || x.method === 'exchange').map(([k, n]) => `<option value="${k}" ${k === x.method ? 'selected' : ''}>${n}${k === 'exchange' ? ' ' + esc(x.ref || '') : ''}</option>`).join('')}</select>
          <input class="in" data-a="${i}" value="${x.amount}" inputmode="decimal" style="width:130px">
          ${!['cash', 'credit', 'exchange'].includes(x.method) ? `<input class="in" data-r="${i}" placeholder="${x.method === 'card' ? 'Autorización' : x.method === 'deposit' ? 'No. de depósito' : 'Referencia'}" value="${esc(x.ref || '')}" style="width:130px">` : ''}
          ${tenders.length > 1 ? `<button class="btn sm d" data-rm="${i}">×</button>` : ''}
        </div>`).join('')}
        <button class="btn sm" id="addT">+ Otra forma de pago</button>
        ${cashAmt > 0 ? `<div class="row" style="margin-top:14px"><div style="flex:1"><label class="f">Efectivo recibido</label><input class="in" id="recv" value="${esc(received)}" inputmode="decimal" placeholder="${cashAmt}"></div>
          <div style="flex:1"><label class="f">Cambio</label><div style="font-size:20px;font-weight:700;padding-top:6px">${L(Math.max(change, 0))}</div></div></div>` : ''}
        <div class="tot" style="margin-top:12px"><span>Pagado</span><span>${L(paid)}</span></div>
        ${Math.abs(paid - t.total) > 0.004 ? `<div class="banner" style="margin:8px 0 0">La suma de pagos (${L(paid)}) debe ser igual al total (${L(t.total)}).</div>` : ''}
      </div>
      <div class="mf"><button class="btn" data-close>Cancelar</button><button class="btn g" id="confirmSale">Confirmar venta</button></div>`, true);
    bindClose();
    const m = $('#modal');
    m.querySelectorAll('[data-m]').forEach(s => s.onchange = () => { tenders[s.dataset.m].method = s.value; draw(); });
    m.querySelectorAll('[data-a]').forEach(s => s.onchange = () => { tenders[s.dataset.a].amount = r2(Number(s.value.replace(',', '.')) || 0); draw(); });
    m.querySelectorAll('[data-r]').forEach(s => s.oninput = () => { tenders[s.dataset.r].ref = s.value; });
    m.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { tenders.splice(Number(b.dataset.rm), 1); draw(); });
    $('#addT').onclick = () => { const rest = r2(t.total - tenders.reduce((a, x) => a + (Number(x.amount) || 0), 0)); tenders.push({ method: 'card', amount: Math.max(rest, 0) }); draw(); };
    const rv = $('#recv'); if (rv) rv.onchange = () => { received = rv.value.replace(',', '.'); draw(); };
    $('#confirmSale').onclick = async () => {
      const paid2 = r2(tenders.reduce((a, x) => a + (Number(x.amount) || 0), 0));
      if (Math.abs(paid2 - t.total) > 0.004) return toast('La suma de los pagos debe ser igual al total.', true);
      if (received !== '' && Number(received) < cashAmt) return toast('El efectivo recibido es menor que el monto en efectivo.', true);
      const exUsed = r2(tenders.filter(x => x.method === 'exchange').reduce((a, x) => a + (Number(x.amount) || 0), 0));
      if (ex && exUsed > ex.amount + 0.004) return toast(`El cambio solo cubre ${L(ex.amount)}.`, true);
      if (tenders.some(x => ['transfer', 'deposit'].includes(x.method) && !(x.ref || '').trim())) return toast('Escriba la referencia de la transferencia o el número de depósito.', true);
      const btn = $('#confirmSale'); btn.disabled = true; btn.textContent = 'Guardando…';
      try {
        const sale = await createSale(POS.kind, POS.customerId, POS.lines, tenders.map(x => ({ ...x, amount: r2(x.amount) })), received !== '' ? r2(Number(received)) : null, { sessionId: curSession() ? curSession().id : null, terminal: (curTerminal() || {}).code || '', address: POS.address || '', exo: { oc: POS.exoOc || '' } });
        let left = 0; if (ex) left = await settleExchange(exUsed, sale);
        resetPos();
        closeModal(); render(); showTicket(sale, true); if (left > 0.004) toast(`Devuelva ${L(left)} en efectivo al cliente (sobrante del cambio).`);
      } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = 'Confirmar venta'; }
    };
  };
  const err = validateSale(POS.kind, cust, POS.lines, []);
  if (err) return toast(err, true);
  draw();
}

async function createSale(kind, customerId, cartLines, tenders, cashReceived, opts = {}) {
  const customer = S.customers.get(customerId) || S.customers.get(WALK_IN);
  const err = validateSale(kind, customer, cartLines, tenders, opts.wh);
  if (err) throw new Error(err);
  if (kind === 'fiscal' && exoValid(customer) && cartLines.some(l => l.tax === 'EXO') && !(opts.exo && String(opts.exo.oc || '').trim())) throw new Error('Cliente exonerado: escriba el número de la orden de compra exenta.');
  if (opts.currency === 'USD' && !(Number(opts.rate) > 0)) throw new Error('Escriba el tipo de cambio del dólar.');
  const t = cartTotals(cartLines);
  const id = uid();
  const createdAt = nowIso();
  const lines = cartLines.map((l, i) => {
    const p = S.products.get(l.productId); const u = unitById(p, l.unitId);
    const lt = r2(l.qty * l.price); const s = splitTax(lt, l.tax);
    const cost = p.kind === 'service' ? null : effectiveCost(p);
    if (l.tax === 'EXO') l = { ...l, taxOrig: l.taxOrig || p.tax };
    return { n: i + 1, productId: p.id, name: p.name, sku: p.sku, unitId: u.id, unitLabel: u.label, factor: u.factor, qty: l.qty, qtyBase: r4(l.qty * u.factor),
      price: l.price, listPrice: l.listPrice ?? l.price, discountPct: Number(l.discountPct || 0), discAuth: l.discAuth || null, priceSource: l.source || '', tax: l.tax, taxOrig: l.tax === 'EXO' ? (l.taxOrig || p.tax) : null, taxRate: s.rate, taxAmount: s.tax, total: lt, unitCost: cost, service: p.kind === 'service' };
  });
  for (const g of cartGifts(cartLines)) {
    const gp = S.products.get(g.productId);
    lines.push({ n: lines.length + 1, productId: gp.id, name: gp.name, sku: gp.sku, unitLabel: gp.baseUnit || 'Unidad', factor: 1, qty: g.qtyBase, qtyBase: g.qtyBase,
      price: 0, priceSource: 'Regalo por ' + g.fromName, tax: gp.tax || 'ISV15', taxRate: (TAXES[gp.tax] || TAXES.ISV15).rate, taxAmount: 0, total: 0,
      unitCost: gp.kind === 'service' ? null : effectiveCost(gp), service: gp.kind === 'service', gift: true });
  }
  const goods = lines.filter(l => !l.service);
  const missingCost = goods.some(l => l.unitCost == null);
  const costTotal = r2(goods.reduce((a, l) => a + (l.unitCost == null ? 0 : l.qtyBase * l.unitCost), 0));
  const credit = r2(tenders.filter(x => x.method === 'credit').reduce((a, x) => a + x.amount, 0));

  // Número: se toma con bloqueo para que dos cajas no repitan
  let number, fiscalData = null;
  await withNumberLock(async () => {
    const cfg = clone(S.config);
    if (kind === 'fiscal') {
      const fp = fiscalProblem(cfg); if (fp) throw new Error(fp);
      const f = cfg.fiscal; const n = Number(f.next);
      number = fiscalNumber(f, n);
      fiscalData = { cai: f.cai, from: fiscalNumber(f, f.from), to: fiscalNumber(f, f.to), deadline: f.deadline, n };
      cfg.fiscal.next = n + 1;
    } else {
      number = (cfg.internalPrefix || 'VI-') + pad(cfg.internalNext || 1, 8);
      cfg.internalNext = (cfg.internalNext || 1) + 1;
    }
    await putConfig(cfg);
  });

  const wh = opts.wh || posWh();
  const sale = {
    id, number, kind, wh, terminal: opts.terminal || '', deliveryAddress: opts.address || '', sellerId: opts.sellerId || customer.sellerId || '', orderId: opts.orderId || null, sessionId: opts.sessionId || null, status: 'issued', createdAt, customerId: customer.id, customerName: customer.legalName || customer.name,
    customerRtn: customer.rtn || '', lines, subtotal: t.subtotal, tax: t.tax, total: t.total, exempt: t.exempt,
    tenders, cashReceived, change: cashReceived != null ? r2(cashReceived - tenders.filter(x => x.method === 'cash').reduce((a, x) => a + x.amount, 0)) : 0,
    paymentType: credit > 0 ? (credit < t.total ? 'mixed' : 'credit') : 'cash', balance: credit,
    dueDate: credit > 0 ? (opts.dueDate || new Date(Date.now() + (Number(customer.termDays || 30) * 864e5)).toISOString().slice(0, 10)) : null,
    exonerated: t.exonerated, g15: t.g15, i15: t.i15, g18: t.g18, i18: t.i18, discount: t.discount,
    exo: t.exonerated > 0 ? { oc: String((opts.exo || {}).oc || '').trim(), constancia: customer.exoConstancia || '', sag: customer.exoSag || '' } : null,
    bankAccountId: (tenders || []).some(t => ['card', 'transfer', 'deposit'].includes(t.method)) ? (opts.bankAccountId || S.config.posBankAccount || '') : '',
    customerPO: opts.customerPO || '', notes: opts.notes || '', currency: opts.currency === 'USD' ? 'USD' : 'HNL', rate: opts.currency === 'USD' ? Number(opts.rate) : null, origin: opts.origin || 'pos',
    costTotal, hasMissingCost: missingCost, fiscal: fiscalData,
    company: { name: S.config.legalName || S.config.tradeName, tradeName: S.config.tradeName, rtn: S.config.rtn, address: S.config.address, phone: S.config.phone }
  };
  await put('sales', sale);
  for (const l of goods) { l.wh = wh; const mv = await moveStock(l.productId, 'out', l.qtyBase, l.gift ? 'Regalo en venta' : 'Venta', sale.number, l.unitCost, createdAt, '', { wh, customerId: customer.id, saleId: sale.id }); if (mv.lots) l.lots = mv.lots; }
  await put('sales', sale);
  if (!customer.walkIn) for (const l of goods) await deliverReservations(customer.id, l.productId, wh, l.qtyBase, sale.number);
  return sale;
}

// ---------- Bodegas y existencias por bodega ----------
const mainWh = () => cfgWarehouses()[0];
function whOf(p) { return p.warehouse && cfgWarehouses().includes(p.warehouse) ? p.warehouse : mainWh(); }
// Productos de versiones anteriores: toda la existencia está en su bodega asignada
function stockByOf(p) { if (p.stockBy) return p.stockBy; return Number(p.stock || 0) ? { [whOf(p)]: Number(p.stock || 0) } : {}; }
function whStock(p, wh) { if (typeof p === 'string') p = S.products.get(p); return p ? r4(Number(stockByOf(p)[wh] || 0)) : 0; }
const lotWh = (p, l) => l.wh || whOf(p);
function reservedOf(pid, wh, exceptCustomerId) {
  let q = 0; for (const r of S.reservations) if (r.status === 'active' && r.productId === pid && (!wh || r.wh === wh) && r.customerId !== exceptCustomerId) q += r.qtyBase - (r.deliveredBase || 0);
  return r4(q);
}
function availableOf(pid, wh, exceptCustomerId) { const p = S.products.get(pid); if (!p) return 0; return r4((wh ? whStock(p, wh) : Number(p.stock || 0)) - reservedOf(pid, wh, exceptCustomerId)); }
const USER_NAME = () => { const u = usersOn() && curUser(); return u ? u.name : 'Usuario del sistema'; };
let MV_SEQ = Date.now() * 1000;
const mvOrder = (a, b) => (a.date || '').localeCompare(b.date || '') || (a.seq || 0) - (b.seq || 0);

// Movimiento de inventario + saldo del producto (ÚNICA vía para cambiar existencias: regla de oro)
async function moveStock(productId, dir, qtyBase, type, ref, unitCost, date, note, opts = {}) {
  const p = clone(S.products.get(productId));
  const wh = opts.wh || whOf(p);
  const by = clone(stockByOf(p));
  let lotsMoved = null;
  if (p.trackLots) {
    p.lots = (p.lots || []).map(l => ({ ...l, wh: lotWh(p, l) }));
    if (dir === 'in') {
      const add = opts.lots && opts.lots.length ? opts.lots : [{ lot: 'SIN-LOTE', expiry: '', qty: qtyBase }];
      lotsMoved = [];
      for (const a of add) {
        const ex = p.lots.find(l => l.lot === a.lot && (l.expiry || '') === (a.expiry || '') && l.wh === wh);
        if (ex) ex.qty = r4(ex.qty + Number(a.qty)); else p.lots.push({ id: uid(), lot: a.lot, expiry: a.expiry || '', qty: r4(Number(a.qty)), wh });
        lotsMoved.push({ lot: a.lot, expiry: a.expiry || '', qty: r4(Number(a.qty)) });
      }
    } else {
      let rest = qtyBase; lotsMoved = [];
      const here = p.lots.filter(l => l.wh === wh && l.qty > 0);
      // Si se indican lotes (anulaciones, devoluciones, bajas), salen esos primero
      for (const want of (opts.lots || [])) { const l = here.find(x => x.lot === want.lot && (x.expiry || '') === (want.expiry || '')); if (!l || rest <= 0) continue; const take = r4(Math.min(l.qty, want.qty, rest)); l.qty = r4(l.qty - take); rest = r4(rest - take); lotsMoved.push({ lot: l.lot, expiry: l.expiry || '', qty: take }); }
      // FEFO: luego el lote que vence antes
      for (const l of here.filter(x => x.qty > 0).sort((a, b) => (a.expiry || '9999').localeCompare(b.expiry || '9999'))) { if (rest <= 0) break; const take = r4(Math.min(l.qty, rest)); l.qty = r4(l.qty - take); rest = r4(rest - take); lotsMoved.push({ lot: l.lot, expiry: l.expiry || '', qty: take }); }
      if (rest > 0) lotsMoved.push({ lot: 'SIN-LOTE', expiry: '', qty: rest });
    }
    p.lots = p.lots.filter(l => l.qty > 0);
  }
  const stock = Number(p.stock || 0);
  if (dir === 'in' && unitCost != null && (type === 'Entrada de mercadería' || type === 'Inventario inicial')) {
    p.avgCost = newAvgCost(stock, p.avgCost, qtyBase, unitCost);
    p.lastCost = r6(unitCost);
  }
  by[wh] = r4(Number(by[wh] || 0) + (dir === 'in' ? qtyBase : -qtyBase));
  p.stockBy = by;
  p.stock = r4(Object.values(by).reduce((a, x) => a + Number(x || 0), 0));

    balanceAfter: p.stock, wh, whBalanceAfter: by[wh], user: USER_NAME(), note: note || '', seq: ++MV_SEQ };

  await put('movements', mv);
  await put('products', p);
  return mv;
}

function ticketText(s, W0) {
  const c = s.company || {}; const W = W0 || 40; const line = '-'.repeat(W);
  const center = (x) => { x = String(x); const sp = Math.max(0, Math.floor((W - x.length) / 2)); return ' '.repeat(sp) + x; };
  const lr = (a, b) => lrW(a, b, W);
  const out = [];
  out.push(center(c.tradeName || ''));
  if (c.name && c.name !== c.tradeName) out.push(center(c.name));
  if (c.rtn) out.push(center('RTN: ' + c.rtn));
  if (c.address) out.push(center(c.address));
  if (c.phone) out.push(center('Tel: ' + c.phone));
  out.push(line);
  if (s.kind === 'fiscal') {
    out.push(center('FACTURA'));
    out.push('No. ' + s.number);
    out.push('CAI: ' + s.fiscal.cai);
    out.push('Rango autorizado:');
    out.push(' ' + s.fiscal.from + ' al');
    out.push(' ' + s.fiscal.to);
    out.push('Fecha límite de emisión: ' + fdate(s.fiscal.deadline + 'T12:00:00'));
  } else {
    out.push(center('COMPROBANTE INTERNO'));
    out.push(center('No válido como documento fiscal'));
    out.push('No. ' + s.number);
  }
  out.push('Fecha: ' + fdt(s.createdAt));
  out.push('Cliente: ' + s.customerName);
  if (s.customerRtn) out.push('RTN cliente: ' + s.customerRtn);
  if (s.exo) { out.push('Datos del adquirente exonerado:'); out.push(' No. orden de compra exenta: ' + (s.exo.oc || '')); out.push(' No. constancia de registro de'); out.push(' exonerado: ' + (s.exo.constancia || '')); out.push(' No. registro SAG: ' + (s.exo.sag || '')); }
  if (s.customerPO) out.push('Orden de compra del cliente: ' + s.customerPO);
  if (s.sellerId && sellerById(s.sellerId)) out.push('Vendedor: ' + sellerById(s.sellerId).name);
  if (s.currency === 'USD') out.push(`Moneda: USD · Tipo de cambio L ${Number(s.rate).toFixed(4)}`);
  out.push(line);
  for (const l of s.lines) {
    out.push((l.gift ? '(REGALO) ' : '') + l.name.slice(0, W - (l.gift ? 9 : 0)));
    const lp = Number(l.listPrice ?? l.price);
    out.push(lr(`  ${qfmt(l.qty)} ${l.unitLabel} x ${L(lp > l.price ? lp : l.price)}`, L(lp > l.price ? r2(lp * l.qty) : l.total)));
    if (lp > l.price + 0.004) out.push(lr(`  Descuento ${l.discountPct ? l.discountPct + ' %' : ''}`, '- ' + L(r2((lp - l.price) * l.qty))));
  }
  out.push(line);
  const hasBreak = s.g15 != null;
  if (hasBreak) {
    if (s.discount) out.push(lr('Descuentos y rebajas otorgados', '- ' + L(s.discount)));
    out.push(lr('Importe exento', L(s.exempt || 0)));
    out.push(lr('Importe exonerado', L(s.exonerated || 0)));
    out.push(lr('Importe gravado 15%', L(s.g15 || 0)));
    if (s.g18) out.push(lr('Importe gravado 18%', L(s.g18)));
    out.push(lr('ISV 15%', L(s.i15 || 0)));
    if (s.g18) out.push(lr('ISV 18%', L(s.i18 || 0)));
  } else {
    if (s.exempt) out.push(lr('Importe exento', L(s.exempt)));
    out.push(lr('Subtotal', L(s.subtotal)));
    out.push(lr('ISV', L(s.tax)));
  }
  out.push(lr('TOTAL', L(s.total)));
  if (s.currency === 'USD') out.push(lr('TOTAL EN DÓLARES', 'US$ ' + (s.total / s.rate).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })));
  if (s.notes) { out.push(line); out.push('Observaciones: ' + s.notes); }
  out.push(line);
  for (const t of s.tenders) out.push(lr(METHODS[t.method] + (t.ref ? ' ' + t.ref : ''), L(t.amount)));
  if (s.cashReceived != null) { out.push(lr('Efectivo recibido', L(s.cashReceived))); out.push(lr('Cambio', L(s.change))); }
  if (s.balance > 0 && s.dueDate) out.push('Crédito, vence: ' + fdate(s.dueDate + 'T12:00:00'));
  if (s.status === 'voided') { out.push(line); out.push(center('*** ANULADA ***')); out.push('Motivo: ' + (s.voidReason || '')); }
  out.push(line);
  if (s.kind === 'fiscal') { out.push('Original: Cliente / Copia: Emisor'); out.push(center('La factura es beneficio de todos. Exíjala.')); }
  out.push(center('¡Gracias por su compra!'));
  return out.join('\n');
}

const DEFAULT_UNITS = ['Unidad', 'Paquete', 'Docena', 'Caja', 'Fardo', 'Saco', 'Kilogramo', 'Libra', 'Litro', 'Galón', 'Metro', 'Botella', 'Bolsa'];
const DEFAULT_LISTS = ['General', 'Mayorista', 'Distribuidor', 'Especial'];

const cfgLists = () => S.config.priceLists && S.config.priceLists.length ? S.config.priceLists : DEFAULT_LISTS;

const cfgWarehouses = () => S.config.warehouses || ['Bodega principal'];
const prodMargin = (p, priceIncl) => {
  const c = effectiveCost(p); const base = splitTax(priceIncl == null ? retailIncl(p) : priceIncl, p.tax).base;
  return c == null || base <= 0 ? null : (base - c) / base * 100;
};
// Precio de venta al público con ISV incluido (si el producto se registró sin ISV, se le suma)
function inclTax(p, v) { return p.priceIncludesTax === false ? r2(Number(v) * (1 + (TAXES[p.tax] || TAXES.ISV15).rate)) : r2(Number(v)); }
function retailIncl(p) { return inclTax(p, p.price); }

/* ---------- Motor de precios: aplica el precio más bajo que corresponda ---------- */
function priceInfo(p, u, customer, qtyBase) {
  const f = Number(u.factor) || 1; const t = today();
  const cands = [{ price: inclTax(p, u.price != null && u.price !== '' ? u.price : Number(p.price) * f), source: '' }];
  const list = customer && !customer.walkIn ? (customer.priceList || 'General') : 'General';
  if (list !== 'General' && p.prices && p.prices[list] != null && p.prices[list] !== '') cands.push({ price: inclTax(p, p.prices[list] * f), source: 'Lista ' + list });
  const tier = (p.tiers || []).filter(x => qtyBase >= Number(x.minQty)).sort((a, b) => b.minQty - a.minQty)[0];
  if (tier) cands.push({ price: inclTax(p, tier.price * f), source: `Precio por cantidad (desde ${qfmt(tier.minQty)})` });
  const pr = p.promo;
  if (pr && pr.price !== '' && pr.price != null && (!pr.from || t >= pr.from) && (!pr.to || t <= pr.to)) cands.push({ price: inclTax(p, pr.price * f), source: 'Promoción' + (pr.name ? ': ' + pr.name : '') });
  return cands.reduce((m, c) => (c.price < m.price ? c : m));
}
function giftActive(p) { const g = p.gift; const t = today(); return g && g.productId && Number(g.buyQty) > 0 && Number(g.qty) > 0 && (!g.from || t >= g.from) && (!g.to || t <= g.to) && S.products.get(g.productId); }
// Regalos que corresponden al carrito (en unidad base del producto regalado)
function cartGifts(lines) {
  const byProd = new Map();
  for (const l of lines) { const p = S.products.get(l.productId); if (!p) continue; byProd.set(p.id, r4((byProd.get(p.id) || 0) + l.qty * unitById(p, l.unitId).factor)); }
  const out = [];
  for (const [pid, q] of byProd) {
    const p = S.products.get(pid); if (!giftActive(p)) continue;
    const times = Math.floor(q / Number(p.gift.buyQty) + 1e-9);
    if (times > 0) out.push({ productId: p.gift.productId, qtyBase: r4(times * Number(p.gift.qty)), fromId: pid, fromName: p.name });
  }
  return out;
}

let topPeriod = 30;
function topTab(box) {
  const since = addDays(today(), -(topPeriod - 1));
  const agg = new Map();
  S.sales.filter(s => s.status === 'issued' && dayKey(s.createdAt) >= since).forEach(s => s.lines.forEach(l => {
    const a = agg.get(l.productId) || { qty: 0, amount: 0, profit: 0, docs: 0 };
    a.qty += l.qtyBase; a.amount += l.total; a.docs++; if (l.unitCost != null) a.profit += splitTax(l.total, l.tax).base - l.qtyBase * l.unitCost;
    agg.set(l.productId, a);
  }));
  const rows = [...agg.entries()].map(([id, a]) => ({ p: S.products.get(id), ...a })).filter(r => r.p).sort((a, b) => b.amount - a.amount);
  box.innerHTML = `<div class="card"><div class="pad row" style="justify-content:space-between"><b>Productos más vendidos</b>
    <select class="in selp" id="topP" style="width:auto">${[[7, 'Últimos 7 días'], [30, 'Últimos 30 días'], [90, 'Últimos 90 días'], [365, 'Último año']].map(([v, n]) => `<option value="${v}" ${v === topPeriod ? 'selected' : ''}>${n}</option>`).join('')}</select></div>

function lowTab(box, all) {

    .sort((a, b) => Number(a.stock || 0) / Number(a.minStock || 1) - Number(b.stock || 0) / Number(b.minStock || 1));
  const supOf = (p) => [...S.suppliers.values()].find(s => s.name === p.supplier && supStatus(s) === 'active');
  const need = rows.filter(p => Number(p.stock || 0) + onOrder(p.id) < Number(p.minStock));
  const bySup = new Map(); need.forEach(p => { const s = supOf(p); if (s && (s.currency || 'HNL') === 'HNL') bySup.set(s.id, s); });
  box.innerHTML = `<div class="card"><div class="pad row" style="justify-content:space-between"><div><b>Existencias bajas</b><div class="sub">Productos activos por debajo de su existencia mínima; lo sugerido descuenta lo que ya viene en órdenes aprobadas</div></div>
    ${bySup.size ? `<button class="btn p" id="genPO">Crear ${bySup.size} orden(es) de compra</button>` : ''}</div>
    ${rows.length ? `<div class="scroll"><table><thead><tr><th>Producto</th><th class="num">Existencia</th><th class="num">Mínimo</th><th class="num">Máximo</th><th class="num">En camino</th><th class="num">Sugerido comprar</th><th class="hide-m">Proveedor</th></tr></thead><tbody>
    ${rows.map(p => { const st = Number(p.stock || 0); const oo = onOrder(p.id); const target = p.maxStock !== '' && p.maxStock != null ? Number(p.maxStock) : Number(p.minStock) * 2; return `<tr class="click" data-p="${p.id}"><td><b>${esc(p.name)}</b><div class="muted" style="font-size:12px">${esc(p.sku)}</div></td>
      <td class="num"><span class="tag ${st <= 0 ? 'bad' : 'warn'}">${qfmt(st)}</span></td><td class="num">${qfmt(p.minStock)}</td><td class="num">${p.maxStock === '' || p.maxStock == null ? '—' : qfmt(p.maxStock)}</td>
      <td class="num">${oo ? qfmt(oo) : '—'}</td><td class="num"><b>${qfmt(Math.max(0, r4(target - st - oo)))} ${esc(p.baseUnit || '')}</b></td><td class="hide-m">${p.supplier ? esc(p.supplier) + (supOf(p) ? '' : ' <span class="pill n">sin ficha</span>') : '—'}</td></tr>`; }).join('')}
    </tbody></table></div>` : '<div class="empty">Ningún producto por debajo de su mínimo.</div>'}</div>`;
  box.querySelectorAll('[data-p]').forEach(tr => tr.onclick = () => { location.hash = 'producto-' + tr.dataset.p; });
  const g = $('#genPO'); if (g) g.onclick = async () => {
    g.disabled = true;
    try {
      let n = 0, noCost = 0;
      for (const s of bySup.values()) {
        const all2 = suggestedLines(s); const lines = all2.filter(l => l.cost !== '' && l.cost != null); noCost += all2.length - lines.length; if (!lines.length) continue;
        const o = { id: uid(), number: await nextNumber('poNext', 'OC-', 6), createdAt: nowIso(), history: [], supplierId: s.id, supplierName: s.name, supplierRtn: s.rtn || '', date: today(),
          expectedDate: s.leadDays !== '' && s.leadDays != null ? addDays(today(), Number(s.leadDays)) : '', discountPct: Number(s.discount || 0), currency: 'HNL', rate: 1, notes: '', status: 'draft',
          lines: lines.map(l => { const p = S.products.get(l.productId); const u = unitById(p, l.unitId); return { key: l.key, productId: p.id, name: p.name, sku: p.sku, supplierCode: p.supplierCode || '', unitId: u.id, unitLabel: u.label, factor: u.factor, qty: l.qty, cost: Number(l.cost), received: 0 }; }) };
        poHist(o, 'Orden creada desde existencias bajas'); await put('purchaseOrders', o); n++;
      }
      if (n) { toast(`${n} orden(es) creadas por aprobar en Compras${noCost ? ` · ${noCost} producto(s) sin costo conocido quedaron fuera` : ''}`); buyTab = 'pend'; location.hash = 'compras'; }
      else { toast('Esos productos no tienen costo conocido: cree la orden desde Compras.', true); g.disabled = false; }
    } catch (e) { toast(e.message, true); g.disabled = false; }
  };
}

async function resizePhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('imagen no válida')); i.src = url; });
    const max = 360, k = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.72);
  } finally { URL.revokeObjectURL(url); }
}

      const base = priceIncl == null ? null : splitTax(priceIncl, p.tax).base;
      const mg = base && cost != null && !isNaN(cost) && cost !== '' ? (base - cost) / base * 100 : null;
      $('#marginBox').innerHTML = priceIncl == null ? '' : `<div class="row" style="gap:16px">

    askNew('#f_cat', 'Nueva categoría', async (n) => { const cfg = clone(S.config); if (!cfgCats().some(c => c.name.toLowerCase() === n.toLowerCase())) cfg.categories = [...cfgCats(), { name: n, subs: [] }]; await putConfig(cfg); p.category = n; p.subcategory = ''; });
    askNew('#f_sub', 'Nueva subcategoría de ' + (p.category || ''), async (n) => { const cfg = clone(S.config); cfg.categories = clone(cfgCats()); const c = cfg.categories.find(x => x.name === p.category); if (c && !(c.subs || []).includes(n)) c.subs = [...(c.subs || []), n]; await putConfig(cfg); p.subcategory = n; });
    askNew('#f_brand', 'Nueva marca', async (n) => { const cfg = clone(S.config); if (!cfgBrands().includes(n)) cfg.brands = [...cfgBrands(), n]; await putConfig(cfg); p.brand = n; });
    $('#addU').onclick = () => { sync(); units.push({ id: uid(), label: '', factor: '', price: '', barcode: '', canBuy: true, canSell: true }); draw(); };
    m.querySelectorAll('[data-urm]').forEach(b => b.onclick = () => { sync(); units.splice(Number(b.dataset.urm), 1); draw(); });
    $('#addT').onclick = () => { sync(); tiers.push({ minQty: '', price: '' }); draw(); };
    m.querySelectorAll('[data-trm]').forEach(b => b.onclick = () => { sync(); tiers.splice(Number(b.dataset.trm), 1); draw(); });

      sync();
      const bad = (msg) => toast(msg, true);
      if (!p.name) return bad('El nombre es obligatorio.');
      if (p.price === '' || isNaN(Number(p.price)) || Number(p.price) < 0) return bad('Escriba un precio de venta válido.');
      if (p.purchasePrice !== '' && (isNaN(Number(p.purchasePrice)) || Number(p.purchasePrice) < 0)) return bad('El costo de compra no es válido.');
      for (const l of lists) if (p.prices[l] !== '' && (isNaN(p.prices[l]) || p.prices[l] < 0)) return bad(`El precio ${l.toLowerCase()} no es válido.`);
      if (p.maxDiscount < 0 || p.maxDiscount > 100) return bad('El descuento máximo debe estar entre 0 y 100 %.');
      if (p.minStock !== '' && p.maxStock !== '' && Number(p.maxStock) < Number(p.minStock)) return bad('La existencia máxima no puede ser menor que la mínima.');
      if (p.sku && [...S.products.values()].some(x => x.id !== p.id && (x.sku || '').toLowerCase() === p.sku.toLowerCase())) return bad('Ya existe otro producto con ese código interno.');
      const codes = [p.barcode, ...units.map(u => u.barcode)].filter(Boolean);
      if (new Set(codes).size !== codes.length) return bad('Hay códigos de barras repetidos en este producto.');
      for (const c of codes) { const hit = findByCode(c); if (hit && hit.p.id !== p.id) return bad(`El código ${c} ya pertenece a "${hit.p.name}".`); }
      for (const u of units) {
        if (!u.label) return bad('Cada presentación necesita un nombre.');
        if (!(Number(u.factor) > 0)) return bad(`Indique cuántas unidades base contiene "${u.label}".`);
        if (u.price !== '' && !(Number(u.price) >= 0)) return bad(`El precio de "${u.label}" no es válido.`);
      }
      for (const t of tiers) if (!(t.minQty > 0) || !(t.price >= 0) || t.price === '') return bad('Revise las escalas de descuento por cantidad.');
      if (p.promo.price !== '' && (isNaN(p.promo.price) || p.promo.price < 0)) return bad('El precio de promoción no es válido.');
      if (p.promo.from && p.promo.to && p.promo.to < p.promo.from) return bad('La promoción termina antes de empezar.');
      if (p.gift.productId && !(p.gift.buyQty > 0 && p.gift.qty > 0)) return bad('Para el regalo indique "por cada" y la cantidad regalada.');
      if (p.kind === 'service') { p.trackLots = false; }
      if (!p.trackLots && (p.lots || []).some(l => l.qty > 0)) return bad('Este producto tiene lotes con existencia; no se puede desactivar el control de lotes.');
      $('#saveP').disabled = true;
      try {
        if (!p.sku) await withNumberLock(async () => { const cfg = clone(S.config); p.sku = 'PROD-' + pad(cfg.productNext || 1, 5); cfg.productNext = (cfg.productNext || 1) + 1; await putConfig(cfg); });
        if (p.supplier && !cfgSuppliers().includes(p.supplier)) { const cfg = clone(S.config); cfg.suppliers = [...cfgSuppliers(), p.supplier]; await putConfig(cfg); }
        const out = { ...p, photo, price: r2(Number(p.price)), purchasePrice: p.purchasePrice === '' ? null : r6(Number(p.purchasePrice)),
          prices: Object.fromEntries(Object.entries(p.prices).filter(([, v]) => v !== '' && v != null).map(([k, v]) => [k, r2(v)])),
          units: units.map(u => ({ id: u.id || uid(), label: u.label, unit: u.label.split(/\s/)[0], factor: Number(u.factor), price: u.price === '' ? null : r2(Number(u.price)), barcode: u.barcode, canBuy: true, canSell: true })),
          tiers: tiers.map(t => ({ minQty: Number(t.minQty), price: r2(t.price) })).sort((a, b) => a.minQty - b.minQty),
          createdAt: p.createdAt || nowIso(), updatedAt: nowIso() };
        // Regla de oro: el formulario nunca cambia existencias, lotes ni costos (solo los movimientos)
        const cur = S.products.get(out.id);
        if (cur) { out.stock = cur.stock; out.stockBy = clone(stockByOf(cur)); out.lots = (cur.lots || []).map(l => ({ ...l, wh: lotWh(cur, l) })); out.avgCost = cur.avgCost; out.lastCost = cur.lastCost; }
        else { out.stock = 0; out.stockBy = {}; out.lots = []; }
        await put('products', out); closeModal(); toast('Producto guardado');
        render();
      } catch (e) { toast(e.message, true); $('#saveP').disabled = false; }
    };
  };
  draw();
}
// Pequeño cuadro para pedir un nombre sin perder el formulario
function promptBox(label) {
  return new Promise(res => {
    const prev = $('#modal').innerHTML; const prevCls = $('#modal').className;
    const wrap = document.createElement('div'); wrap.className = 'mb on'; wrap.style.zIndex = 55;
    wrap.innerHTML = `<div class="modal sm"><div class="mh"><h2>${esc(label)}</h2></div><div class="mbody"><input class="in" id="pbIn"></div><div class="mf"><button class="btn" id="pbNo">Cancelar</button><button class="btn p" id="pbOk">Agregar</button></div></div>`;
    document.body.appendChild(wrap); const inp = wrap.querySelector('#pbIn'); setTimeout(() => inp.focus(), 20);
    const done = (v) => { wrap.remove(); res(v); };
    wrap.querySelector('#pbNo').onclick = () => done(''); wrap.querySelector('#pbOk').onclick = () => done(inp.value.trim());
    inp.onkeydown = (e) => { if (e.key === 'Enter') done(inp.value.trim()); if (e.key === 'Escape') done(''); };
    void prev; void prevCls;
  });
}

function validateProductImport(rows) {
  const ok = [], errors = [];
  if (!rows.length) return { ok, errors: [{ row: 1, msg: 'El archivo está vacío.' }] };

  const head = rows[0].map(norm); const idx = {}; PX_HEAD.forEach(h => { idx[h] = head.indexOf(norm(h)); });
  if (idx['Nombre'] < 0 || idx['Precio minorista'] < 0) return { ok, errors: [{ row: 1, msg: 'Faltan las columnas "Nombre" o "Precio minorista". Use la plantilla.' }] };
  const skus = new Set([...S.products.values()].map(p => (p.sku || '').toLowerCase()));
  const codes = new Set(); [...S.products.values()].forEach(p => unitsOf(p).forEach(u => u.barcode && codes.add(u.barcode)));
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i]; const g = (h) => idx[h] >= 0 ? String(r[idx[h]] ?? '').trim() : ''; const row = i + 1;
    if (r.every(x => String(x ?? '').trim() === '')) continue;
    const name = g('Nombre'); if (!name) { errors.push({ row, msg: 'Falta el nombre.' }); continue; }
    const n = (h) => { const v = g(h).replace(/[L\s]/g, '').replace(',', '.'); return v === '' ? '' : Number(v); };
    const price = n('Precio minorista');
    if (price === '' || isNaN(price) || price < 0) { errors.push({ row, msg: `${name}: precio minorista no válido.` }); continue; }
    const nums = ['Precio mayorista', 'Precio distribuidor', 'Precio especial', 'Costo de compra', 'Existencia mínima', 'Existencia máxima', 'Unidades por presentación', 'Precio presentación', 'Existencia inicial', 'Días de abastecimiento'].map(h => [h, n(h)]);
    const badN = nums.find(([, v]) => v !== '' && (isNaN(v) || v < 0)); if (badN) { errors.push({ row, msg: `${name}: "${badN[0]}" no es un número válido.` }); continue; }
    const V = Object.fromEntries(nums);
    const sku = g('Código interno');
    if (sku && skus.has(sku.toLowerCase())) { errors.push({ row, msg: `${name}: el código ${sku} ya existe.` }); continue; }
    const bar = g('Código de barras');
    if (bar && codes.has(bar)) { errors.push({ row, msg: `${name}: el código de barras ${bar} ya existe.` }); continue; }
    const pres = g('Presentación');
    if (pres && !(V['Unidades por presentación'] > 0)) { errors.push({ row, msg: `${name}: indique cuántas unidades tiene "${pres}".` }); continue; }
    const taxRaw = norm(g('Impuesto (ISV15/ISV18/Exento)')); const tax = taxRaw.includes('18') ? 'ISV18' : taxRaw.startsWith('ex') ? 'EXE' : 'ISV15';
    if (sku) skus.add(sku.toLowerCase()); if (bar) codes.add(bar);
    const prices = {}; [['Mayorista', 'Precio mayorista'], ['Distribuidor', 'Precio distribuidor'], ['Especial', 'Precio especial']].forEach(([k, h]) => { if (V[h] !== '') prices[k] = r2(V[h]); });
    const service = /^s/i.test(g('Tipo (Producto/Servicio)'));
    ok.push({ id: uid(), sku, barcode: bar, name, description: g('Descripción'), kind: service ? 'service' : 'goods', category: g('Categoría'), subcategory: g('Categoría') ? g('Subcategoría') : '',
      brand: g('Marca'), photo: '', active: !/^in/i.test(g('Estado')), baseUnit: g('Unidad base') || 'Unidad',
      units: pres ? [{ id: uid(), label: pres, unit: pres.split(/\s/)[0], factor: V['Unidades por presentación'], price: V['Precio presentación'] === '' ? null : r2(V['Precio presentación']), barcode: '', canBuy: true, canSell: true }] : [],
      purchasePrice: V['Costo de compra'] === '' ? null : r6(V['Costo de compra']), avgCost: null, lastCost: null, price: r2(price), prices, maxDiscount: 0,
      stock: 0, minStock: V['Existencia mínima'], maxStock: V['Existencia máxima'], warehouse: cfgWarehouses()[0], location: g('Ubicación'), trackLots: !service && /^s/i.test(g('Controla lotes (Sí/No)')), lots: [],
      tax, priceIncludesTax: !/^n/i.test(g('Precio incluye ISV (Sí/No)')), supplier: g('Proveedor'), supplierCode: g('Código del proveedor'), leadDays: V['Días de abastecimiento'],
      promo: { name: '', price: '', from: '', to: '' }, tiers: [], gift: { buyQty: '', productId: '', qty: '', from: '', to: '' }, _init: V['Existencia inicial'] === '' ? 0 : V['Existencia inicial'] });

function transferForm(preId) {

      <div><label class="f">Hacia</label><select class="in" id="t_to">${whs.filter(w => w !== st.from).map(w => `<option ${w === st.to ? 'selected' : ''}>${esc(w)}</option>`).join('')}</select></div>

  };

}

function reservationForm() {

function releaseReservation(id) {
  const r = S.reservations.find(x => x.id === id);
  confirmBox('Liberar ' + r.number, `Las ${qfmt(r.qtyBase - (r.deliveredBase || 0))} unidades reservadas para ${esc(r.customerName)} vuelven a estar disponibles para la venta.`, 'Liberar reserva', async (reason) => {
    const x = clone(r); x.status = 'released'; x.releasedAt = nowIso(); x.releaseReason = reason; x.events = [...(x.events || []), { at: nowIso(), what: 'Liberación de reserva: ' + reason }];
    await put('reservations', x); toast('Reserva liberada'); render();
  }, true);
}
// Al venderle al cliente se entregan sus reservas (las más antiguas primero)
async function deliverReservations(customerId, productId, wh, qtyBase, saleNumber) {
  let rest = qtyBase;
  for (const r of S.reservations.filter(x => x.status === 'active' && x.customerId === customerId && x.productId === productId && x.wh === wh).sort((a, b) => a.createdAt.localeCompare(b.createdAt))) {
    if (rest <= 0) break; const open = r4(r.qtyBase - (r.deliveredBase || 0)); const take = r4(Math.min(open, rest)); rest = r4(rest - take);
    const x = clone(r); x.deliveredBase = r4((x.deliveredBase || 0) + take); if (x.deliveredBase >= x.qtyBase - 1e-9) { x.status = 'delivered'; x.deliveredAt = nowIso(); }
    x.events = [...(x.events || []), { at: nowIso(), what: `Entregado ${qfmt(take)} en la venta ${saleNumber}` }]; await put('reservations', x);
  }
}

      } catch (e) { toast(e.message, true); $('#c_ok').disabled = false; }
    };
  };
  draw();
}

function expiringLots(days) {
  const lim = addDays(today(), days); const out = [];
  for (const p of S.products.values()) if (p.trackLots) for (const l of (p.lots || [])) if (l.qty > 0 && l.expiry && l.expiry <= lim) out.push({ p, l, wh: lotWh(p, l), d: daysBetween(today(), l.expiry) });
  return out.sort((a, b) => a.d - b.d);
}

function stockForm(mode, preId) {
  const goods = goodsList().filter(p => p.active !== false);
  if (!goods.length) return toast('Primero cree productos inventariables.', true);
  let pid = preId && goods.some(g => g.id === preId) ? preId : goods[0].id; let dir = 'in'; let wh = mainWh();
  const draw = () => {
    const p = S.products.get(pid); const units = unitsOf(p); const reasons = dir === 'in' ? ADJ_IN : ADJ_OUT;
    openModal(`<div class="mh"><h2>${mode === 'in' ? 'Entrada de mercadería' : 'Ajuste de inventario'}</h2><button class="x" data-close>×</button></div>
    <div class="mbody"><div class="form">
      <div style="grid-column:1/-1"><label class="f">Producto</label><select class="in" id="s_p">${goods.map(g => `<option value="${g.id}" ${g.id === pid ? 'selected' : ''}>${esc(g.name)} · existencia ${qfmt(g.stock || 0)}</option>`).join('')}</select></div>
      <div><label class="f">Bodega</label><select class="in" id="s_wh">${cfgWarehouses().map(w => `<option value="${esc(w)}" ${w === wh ? 'selected' : ''}>${esc(w)} (${qfmt(whStock(p, w))})</option>`).join('')}</select></div>
      ${mode === 'adj' ? `<div><label class="f">Tipo de ajuste</label><select class="in" id="s_dir"><option value="in" ${dir === 'in' ? 'selected' : ''}>Ajuste positivo (entra)</option><option value="out" ${dir === 'out' ? 'selected' : ''}>Ajuste negativo (sale)</option></select></div>` : ''}
      <div><label class="f">Presentación</label><select class="in" id="s_u">${units.map(u => `<option value="${u.id}">${esc(u.label)} (${qfmt(u.factor)} ${esc(p.baseUnit)})</option>`).join('')}</select></div>
      <div><label class="f">Cantidad</label><input class="in" id="s_q" inputmode="decimal" autofocus></div>
      ${mode === 'in' ? `<div><label class="f">Costo por presentación (sin ISV)</label><input class="in" id="s_c" inputmode="decimal"></div>
        <div><label class="f">Proveedor</label><input class="in" id="s_sup" list="dlSup2" placeholder="Nombre del proveedor" value="${esc(p.supplier || '')}"><datalist id="dlSup2">${cfgSuppliers().map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>
        <div><label class="f">No. de factura del proveedor</label><input class="in" id="s_doc"></div>
        ${p.trackLots ? `<div><label class="f">Lote *</label><input class="in" id="s_lot"></div><div><label class="f">Vencimiento</label><input class="in" type="date" id="s_exp"></div>` : ''}`
      : `<div><label class="f">Motivo *</label><select class="in" id="s_rs">${reasons.map(r => `<option>${r}</option>`).join('')}</select></div><div style="grid-column:1/-1"><label class="f">Detalle *</label><input class="in" id="s_note" placeholder="Qué pasó"></div>
        ${p.trackLots && dir === 'in' ? `<div><label class="f">Lote</label><input class="in" id="s_lot" placeholder="SIN-LOTE"></div><div><label class="f">Vencimiento</label><input class="in" type="date" id="s_exp"></div>` : ''}${p.trackLots && dir === 'out' ? '<p class="sub" style="grid-column:1/-1">Sale primero el lote que vence antes.</p>' : ''}`}
    </div>${mode === 'in' ? '<p class="sub">El costo actualiza el último costo y el costo promedio. Para compras con orden use Compras › Recibir mercancía.</p>' : '<p class="sub">Todo ajuste queda en el kárdex con fecha, usuario, bodega y motivo.</p>'}</div>
    <div class="mf"><button class="btn" data-close>Cancelar</button><button class="btn p" id="s_ok">Registrar</button></div>`);
    bindClose();
    $('#s_p').onchange = (e) => { pid = e.target.value; draw(); };
    $('#s_wh').onchange = (e) => { wh = e.target.value; };
    const sd = $('#s_dir'); if (sd) sd.onchange = (e) => { wh = $('#s_wh').value; dir = e.target.value; draw(); };
    $('#s_ok').onclick = async () => {
      const u = unitById(p, $('#s_u').value); wh = $('#s_wh').value;
      const q = Number($('#s_q').value.replace(',', '.'));
      if (!(q > 0)) return toast('Escriba una cantidad mayor que cero.', true);
      const qtyBase = r4(q * u.factor);
      $('#s_ok').disabled = true;
      try {
        if (mode === 'in') {
          const cRaw = $('#s_c').value.replace(',', '.').trim();
          if (cRaw === '' || !(Number(cRaw) >= 0)) { $('#s_ok').disabled = false; return toast('Escriba el costo de compra.', true); }
          const unitCost = r6(Number(cRaw) / u.factor);
          const sup = $('#s_sup').value.trim(); const doc = $('#s_doc').value.trim();
          let lotOpt = {};
          if (p.trackLots) { const lot = $('#s_lot').value.trim(); if (!lot) { $('#s_ok').disabled = false; return toast('Escriba el número de lote.', true); } lotOpt = { lots: [{ lot, expiry: $('#s_exp').value, qty: qtyBase }] }; }
          if (sup && !cfgSuppliers().includes(sup)) { const cfg = clone(S.config); cfg.suppliers = [...(S.config.suppliers || []), sup]; await putConfig(cfg); }
          await moveStock(pid, 'in', qtyBase, 'Entrada de mercadería', doc, unitCost, nowIso(), sup ? 'Proveedor: ' + sup : '', { ...lotOpt, supplier: sup, wh });
        } else {
          const note = $('#s_rs').value + ': ' + $('#s_note').value.trim();
          if ($('#s_note').value.trim().length < 3) { $('#s_ok').disabled = false; return toast('Escriba el detalle del ajuste.', true); }
          if (dir === 'out' && !S.config.allowNegative && availableOf(pid, wh) < qtyBase) { $('#s_ok').disabled = false; return toast(`En ${wh} solo hay ${qfmt(availableOf(pid, wh))} disponibles.`, true); }
          const lot = $('#s_lot') ? $('#s_lot').value.trim() : '';
          await moveStock(pid, dir, qtyBase, dir === 'in' ? 'Ajuste de entrada' : 'Ajuste de salida', 'Ajuste', effectiveCost(p), nowIso(), note, { wh, lots: lot ? [{ lot, expiry: $('#s_exp').value, qty: qtyBase }] : null });
        }
        closeModal(); toast('Movimiento registrado'); render();
      } catch (e) { toast(e.message, true); $('#s_ok').disabled = false; }
    };
  };
  draw();
}
