const SUP_TYPES = ['Fabricante', 'Distribuidor', 'Mayorista', 'Importador', 'Productor local', 'Servicios', 'Otro'];
const SUP_STATUS = { active: ['Activo', 'g'], inactive: ['Inactivo', 'n'], blocked: ['Bloqueado', 'r'] };
const SUP_PAY = { cash: 'Efectivo', transfer: 'Transferencia', check: 'Cheque', credit: 'Crédito' };
const CURRENCIES = { HNL: 'Lempiras (HNL)', USD: 'Dólares (USD)' };
const supStatus = (s) => s.status || 'active';
const supPill = (s) => { const [n, t] = SUP_STATUS[supStatus(s)] || SUP_STATUS.active; return `<span class="pill ${t}">${n}</span>`; };
const money = (v, cur) => cur === 'USD' ? 'US$ ' + Number(v || 0).toLocaleString('es-HN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : L(v);
const dOnly = (d) => d ? fdate(d + 'T12:00:00') : '—';

function supRating(s) {
  const ev = s.evaluations || []; if (!ev.length) return null;
  return r2(ev.reduce((a, e) => a + e.score, 0) / ev.length);
}
const ratingPill = (r) => r == null ? '<span class="muted">—</span>' : `<span class="pill ${r >= 4 ? 'g' : r >= 3 ? 'y' : 'r'}">★ ${r.toFixed(1)}</span>`;
function supPurchases(sid) { return S.purchases.filter(p => p.supplierId === sid); }
// Partidas por pagar: facturas con saldo + saldo inicial
function supOpenItems(sid) {
  const items = S.purchases.filter(p => p.status === 'issued' && p.balance > 0.004 && (!sid || p.supplierId === sid))
    .map(p => ({ id: p.id, supplierId: p.supplierId, number: p.number, invoiceNo: p.invoiceNo, balance: p.balance, dueDate: p.dueDate, date: p.date, opening: false }));
  for (const s of S.suppliers.values()) {
    if (sid && s.id !== sid) continue;
    const rest = r2(Number(s.openingBalance || 0) - Number(s.openingPaid || 0));
    if (rest > 0.004) items.push({ id: 'opening', supplierId: s.id, number: 'Saldo inicial', invoiceNo: '', balance: rest, dueDate: s.openingDue || (s.createdAt || nowIso()).slice(0, 10), date: (s.createdAt || nowIso()).slice(0, 10), opening: true });
  }
  return items.sort(supItemOrder);
}
const supItemOrder = (a, b) => (a.dueDate || '').localeCompare(b.dueDate || '') || (a.date || '').localeCompare(b.date || '') || (a.number || '').localeCompare(b.number || '');
function supBalance(sid) { return r2(supOpenItems(sid).reduce((a, i) => a + i.balance, 0)); }
function supStats(sid) {
  const s = S.suppliers.get(sid); const buys = supPurchases(sid).filter(p => p.status === 'issued');
  const pays = S.supplierPayments.filter(p => p.supplierId === sid);
  const bought = r2(buys.reduce((a, p) => a + p.total, 0));
  const paid = r2(buys.reduce((a, p) => a + (p.paidAtPurchase || 0), 0) + pays.reduce((a, p) => a + p.amount, 0));
  const lastPay = [...pays.map(p => p.date), ...buys.filter(p => p.paidAtPurchase > 0).map(p => p.date)].sort().pop() || null;
  const t = today(); const overdue = r2(supOpenItems(sid).filter(i => i.dueDate && i.dueDate < t).reduce((a, i) => a + i.balance, 0));
  return { bought, paid, balance: supBalance(sid), lastPay, count: buys.length, lastBuy: buys.map(p => p.date).sort().pop() || null, overdue, opening: Number(s?.openingBalance || 0) };
}

// La factura del proveedor es también la recepción: entra al inventario, actualiza costo y genera la cuenta por pagar
function purchaseForm(supplierId) {
  const sups = [...S.suppliers.values()].filter(s => supStatus(s) === 'active').sort((a, b) => a.name.localeCompare(b.name));
  if (!sups.length) return toast('Primero registre un proveedor activo.', true);
  const goods = [...S.products.values()].filter(p => p.kind !== 'service' && p.active !== false).sort((a, b) => a.name.localeCompare(b.name));
  if (!goods.length) return toast('Primero cree productos inventariables.', true);
  const st = { sid: supplierId && sups.some(s => s.id === supplierId) ? supplierId : sups[0].id, invoiceNo: '', date: today(), lines: [], rate: '', note: '', wh: mainWh() };
  const applySup = () => { const s = S.suppliers.get(st.sid); st.payType = s.paymentMethod === 'credit' || s.creditDays > 0 ? 'credit' : 'cash'; st.method = s.paymentMethod === 'credit' ? 'transfer' : s.paymentMethod; st.disc = Number(s.discount || 0); st.currency = s.currency || 'HNL'; };
  applySup();
  const lastCostFrom = (pid, sid) => { for (const pu of S.purchases) { if (pu.supplierId !== sid || pu.status !== 'issued' || pu.currency !== st.currency) continue; const l = pu.lines.find(x => x.productId === pid); if (l) return l.cost / l.factor; } return null; };
  const newLine = (p) => { const u = unitsOf(p)[(p.units || []).length ? 1 : 0]; const lc = lastCostFrom(p.id, st.sid); const base = lc != null ? lc : (st.currency === 'HNL' && p.lastCost != null ? p.lastCost : null);
    return { key: uid(), productId: p.id, unitId: u.id, qty: '', cost: base == null ? '' : r2(base * u.factor), lot: '', expiry: '' }; };
  const calc = () => {
    const rate = st.currency === 'USD' ? Number(st.rate) || 0 : 1; let gross = 0, tax = 0;
    const lines = st.lines.map(l => { const p = S.products.get(l.productId); const u = unitById(p, l.unitId); const q = Number(l.qty) || 0; const c = Number(l.cost) || 0;
      const g = q * c; const net = g * (1 - st.disc / 100); const tr = (TAXES[p.tax] || TAXES.ISV15).rate; gross += g; tax += net * tr;
      return { l, p, u, gross: g, net, taxAmt: net * tr }; });
    const disc = gross * st.disc / 100; const net = gross - disc;
    return { lines, rate, gross: r2(gross), disc: r2(disc), net: r2(net), tax: r2(tax), total: r2(net + tax), totalHNL: r2((net + tax) * rate) };
  };
  const totalsHtml = (c, s) => { const cur = st.currency; const minWarn = s.minPurchase !== '' && s.minPurchase != null && c.totalHNL > 0 && c.totalHNL < Number(s.minPurchase);
    return `<div style="margin-top:12px;max-width:360px;margin-left:auto">
        <div class="tot"><span>Subtotal</span><span>${money(c.gross, cur)}</span></div>
        ${c.disc ? `<div class="tot"><span>Descuento ${st.disc} %</span><span>− ${money(c.disc, cur)}</span></div>` : ''}
        <div class="tot"><span>ISV</span><span>${money(c.tax, cur)}</span></div>
        <div class="tot big"><span>Total</span><span>${money(c.total, cur)}</span></div>
        ${cur === 'USD' ? `<div class="tot"><span>En lempiras</span><span>${c.rate ? L(c.totalHNL) : '—'}</span></div>` : ''}
      </div>
      ${minWarn ? `<div class="banner" style="margin:10px 0 0">El total está por debajo de la compra mínima del proveedor (${L(s.minPurchase)}).</div>` : ''}`; };
  const draw = () => {
    const s = S.suppliers.get(st.sid); const c = calc(); const cur = st.currency;
    const due = st.payType === 'credit' ? addDays(st.date, Number(s.creditDays || 0)) : '';
    openModal(`<div class="mh"><h2>Registrar compra</h2><button class="x" data-close>×</button></div>
    <div class="mbody">
      <div class="form">
        <div style="grid-column:span 2"><label class="f">Proveedor</label><select class="in" id="b_sup">${sups.map(x => `<option value="${x.id}" ${x.id === st.sid ? 'selected' : ''}>${esc(x.name)}${x.rtn ? ' · ' + esc(fmtRtn(x.rtn)) : ''}</option>`).join('')}</select></div>
        <div><label class="f">No. de factura del proveedor${st.payType === 'credit' ? ' *' : ''}</label><input class="in" id="b_inv" value="${esc(st.invoiceNo)}" placeholder="000-001-01-00001234"></div>
        <div><label class="f">Fecha de la factura</label><input class="in" type="date" id="b_date" value="${esc(st.date)}" max="${today()}"></div>${cfgWarehouses().length > 1 ? `<div><label class="f">Bodega que recibe</label>${whSelect('b_wh', st.wh)}</div>` : ''}

function voidPurchase(id) {

  const paid = r2(p.payType === 'credit' ? p.total - p.balance - (p.creditApplied || 0) : 0);
  if (paid > 0.004) return toast('Esta compra ya tiene pagos aplicados; no se puede anular.', true);

  if (moved && !S.config.allowNegative) for (const l of p.lines) if (whStock(l.productId, l.wh || mainWh()) < l.qtyBase) return toast(`No hay existencia suficiente de "${l.name}" en ${l.wh || mainWh()} para devolverla (hay ${qfmt(whStock(l.productId, l.wh || mainWh()))}).`, true);
  confirmBox('Anular ' + p.number, moved ? 'La mercadería saldrá del inventario y la cuenta por pagar desaparece. El costo promedio no se recalcula hacia atrás.' : 'La cuenta por pagar desaparece. La mercadería sigue en inventario y sus recepciones vuelven a quedar "sin factura".', 'Anular compra', async (reason) => {

}

/* ================================ COMPRAS ================================ */
// Flujo: orden (por aprobar) → aprobada → recepciones (parciales o completa) → factura del proveedor (cuenta por pagar)
// La orden NO mueve inventario; solo la recepción física lo aumenta.
const PO_STATUS = { draft: ['Por aprobar', 'y'], approved: ['Aprobada', 'b'], partial: ['Recepción parcial', 'b'], received: ['Completada', 'g'], cancelled: ['Cancelada', 'n'] };
const RET_REASONS = ['Producto dañado', 'Producto vencido o por vencer', 'Error en el pedido', 'No cumple la calidad', 'Otro'];
const poPill = (o) => { const [n, t] = PO_STATUS[o.status]; return `<span class="pill ${t}">${n}${o.status === 'received' && o.closedShort ? ' con faltante' : ''}</span>`; };
const lineTaxRate = (pid) => { const p = S.products.get(pid); return (TAXES[(p && p.tax) || 'ISV15'] || TAXES.ISV15).rate; };
function poTotals(o, pendingOnly) {
  let gross = 0, tax = 0;
  for (const l of o.lines) { const q = pendingOnly ? Math.max(0, l.qty - (l.received || 0)) : l.qty; const g = q * l.cost; gross += g; tax += g * (1 - o.discountPct / 100) * lineTaxRate(l.productId); }
  const disc = gross * o.discountPct / 100; const total = gross - disc + tax;
  return { gross: r2(gross), disc: r2(disc), tax: r2(tax), total: r2(total), totalHNL: r2(total * (o.rate || 1)) };
}
const poPending = (o) => o.lines.some(l => (l.received || 0) < l.qty - 1e-9);
const poProgress = (o) => { const a = o.lines.reduce((x, l) => x + l.qty * l.factor, 0); const b = o.lines.reduce((x, l) => x + (l.received || 0) * l.factor, 0); return a ? Math.round(b / a * 100) : 0; };
// Cantidad pedida y aún no recibida (unidad base) en órdenes aprobadas
function onOrder(pid) { let q = 0; for (const o of S.purchaseOrders) if (o.status === 'approved' || o.status === 'partial') for (const l of o.lines) if (l.productId === pid) q += Math.max(0, l.qty - (l.received || 0)) * l.factor; return r4(q); }
function supCreditAvail(sid) { return r2(S.supplierReturns.filter(r => r.supplierId === sid).reduce((a, r) => a + (r.unapplied || 0), 0)); }
// Aplica el saldo a favor (devoluciones) a una factura nueva al crédito
async function applySupplierCredit(pu) {
  if (pu.payType !== 'credit' || pu.balance <= 0) return;
  const allocs = [];
  for (const r of S.supplierReturns.filter(x => x.supplierId === pu.supplierId && x.unapplied > 0.004).sort((a, b) => a.createdAt.localeCompare(b.createdAt))) {
    if (pu.balance <= 0.004) break;
    const a = r2(Math.min(r.unapplied, pu.balance)); pu.balance = r2(pu.balance - a); allocs.push({ returnId: r.id, number: r.number, amount: a });
    const rr = clone(r); rr.unapplied = r2(rr.unapplied - a); rr.usedIn = [...(rr.usedIn || []), { purchaseId: pu.id, number: pu.number, amount: a }]; await put('supplierReturns', rr);
  }
  if (allocs.length) { pu.creditAllocations = allocs; pu.creditApplied = r2(allocs.reduce((x, a) => x + a.amount, 0)); }
}

function suggestedLines(sup) {
  const out = [];
  for (const p of S.products.values()) {
    if (p.active === false || p.kind === 'service' || p.supplier !== sup.name || p.minStock === '' || p.minStock == null) continue;
    const st = Number(p.stock || 0) + onOrder(p.id); if (st >= Number(p.minStock)) continue;
    const target = p.maxStock !== '' && p.maxStock != null ? Number(p.maxStock) : Number(p.minStock) * 2;
    const need = Math.max(0, target - st); const u = unitsOf(p)[(p.units || []).length ? 1 : 0];
    const qty = Math.max(1, Math.ceil(need / u.factor - 1e-9)); const lc = sup.currency === 'HNL' && p.lastCost != null ? p.lastCost : null;
    out.push({ key: uid(), productId: p.id, unitId: u.id, qty, cost: lc == null ? '' : r2(lc * u.factor) });
  }
  return out;
}

  on('#oXls', () => saveXlsx(`orden-${o.number}.xlsx`, 'Orden', [['Orden de compra', o.number], ['Proveedor', o.supplierName], ['Fecha', o.date], ['Entrega esperada', o.expectedDate || ''], [], ['Código', 'Producto', 'Código proveedor', 'Presentación', 'Cantidad', 'Costo', 'Subtotal', 'Recibido'],

/* ------------------------------ Recepción (8–10) ------------------------------ */
function receiveForm(poId) {
  const o = S.purchaseOrders.find(x => x.id === poId); const s = S.suppliers.get(o.supplierId) || {};
  const rows = o.lines.map(l => ({ l, p: S.products.get(l.productId), pending: r4(l.qty - (l.received || 0)), qty: String(r4(l.qty - (l.received || 0))), cost: String(l.cost), lot: '', expiry: '' })).filter(r => r.pending > 0);
  const st = { date: today(), invoiceNo: '', withInv: true, rate: String(o.rate || ''), payType: s.paymentMethod === 'credit' || s.creditDays > 0 ? 'credit' : 'cash', method: s.paymentMethod === 'credit' ? 'transfer' : (s.paymentMethod || 'cash') };
  const draw = () => {
    openModal(`<div class="mh"><h2>Recibir mercancía · ${esc(o.number)}</h2><button class="x" data-close>×</button></div>
    <div class="mbody"><p class="sub" style="margin-top:0">Escriba lo que llegó físicamente. Si llega menos de lo pedido, la diferencia queda pendiente en la orden.</p>
      <div class="scroll"><table><thead><tr><th>Producto</th><th class="num">Pendiente</th><th class="num">Recibido ahora</th><th class="num">Costo según factura</th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr data-rr="${i}"><td><b>${esc(r.p.name)}</b><div class="muted" style="font-size:12px">${esc(r.l.unitLabel)} (${qfmt(r.l.factor)} ${esc(r.p.baseUnit || '')})</div>
          ${r.p.trackLots ? `<div class="row" style="margin-top:6px;gap:6px"><input class="in" data-lot placeholder="Lote *" value="${esc(r.lot)}" style="width:110px;padding:5px 8px"><input class="in" type="date" data-exp value="${esc(r.expiry)}" style="width:150px;padding:5px 8px"></div>` : ''}</td>
        <td class="num">${qfmt(r.pending)}</td><td class="num"><input class="in" data-q value="${esc(r.qty)}" inputmode="decimal" style="width:90px;padding:5px 8px;text-align:right"></td>
        <td class="num"><input class="in" data-c value="${esc(r.cost)}" inputmode="decimal" style="width:110px;padding:5px 8px;text-align:right"></td></tr>`).join('')}
      </tbody></table></div>
      <div class="form" style="margin-top:12px">
        <div><label class="f">Fecha de recepción</label><input class="in" type="date" id="r_date" value="${esc(st.date)}" max="${today()}"></div>${cfgWarehouses().length > 1 ? `<div><label class="f">Bodega que recibe</label>${whSelect('r_wh', st.wh || mainWh())}</div>` : ''}
        ${o.currency === 'USD' ? `<div><label class="f">Tipo de cambio</label><input class="in" id="r_rate" value="${esc(st.rate)}" inputmode="decimal"></div>` : ''}
      </div>
      <label class="chk" style="margin-top:12px"><input type="checkbox" id="r_inv" ${st.withInv ? 'checked' : ''}> La mercadería llegó con la factura del proveedor: registrar la cuenta por pagar</label>
      ${st.withInv ? `<div class="form" style="margin-top:8px">
        <div><label class="f">No. de factura del proveedor *</label><input class="in" id="r_no" value="${esc(st.invoiceNo)}"></div>
        <div><label class="f">Condición</label><select class="in" id="r_pt"><option value="credit" ${st.payType === 'credit' ? 'selected' : ''}>Crédito${s.creditDays ? ` (${s.creditDays} días)` : ''}</option><option value="cash" ${st.payType === 'cash' ? 'selected' : ''}>Contado</option></select></div>
        ${st.payType === 'cash' ? `<div><label class="f">Pagado con</label><select class="in" id="r_m">${['cash', 'transfer', 'check'].map(k => `<option value="${k}" ${st.method === k ? 'selected' : ''}>${SUP_PAY[k]}</option>`).join('')}</select></div>` : ''}
      </div>` : '<p class="sub">La recepción quedará "sin factura"; la registra después en Compras › Registrar factura.</p>'}
      <p class="sub">Al confirmar: 8. se recibe la mercancía, 9. aumenta el inventario y se actualiza el costo${st.withInv ? ', 10. se registra la cuenta por pagar' : ''}.</p>
    </div>
    <div class="mf"><button class="btn" data-close>Cancelar</button><button class="btn p" id="r_ok">Confirmar recepción</button></div>`);
    bindClose();
    const m = $('#modal');
    const sync = () => { const rw = $('#r_wh'); st.wh = rw ? rw.value : mainWh(); st.date = $('#r_date').value || today(); const r = $('#r_rate'); if (r) st.rate = r.value.replace(',', '.').trim(); const no = $('#r_no'); if (no) st.invoiceNo = no.value.trim(); const pt = $('#r_pt'); if (pt) st.payType = pt.value; const mm = $('#r_m'); if (mm) st.method = mm.value;
      m.querySelectorAll('tr[data-rr]').forEach(tr => { const r2_ = rows[Number(tr.dataset.rr)]; r2_.qty = tr.querySelector('[data-q]').value.replace(',', '.').trim(); r2_.cost = tr.querySelector('[data-c]').value.replace(',', '.').trim(); const lo = tr.querySelector('[data-lot]'); if (lo) { r2_.lot = lo.value.trim(); r2_.expiry = tr.querySelector('[data-exp]').value; } }); };
    $('#r_inv').onchange = (e) => { sync(); st.withInv = e.target.checked; draw(); };
    const pt = $('#r_pt'); if (pt) pt.onchange = () => { sync(); draw(); };
    $('#r_ok').onclick = async () => {
      sync(); const bad = (x) => toast(x, true);
      const take = rows.filter(r => Number(r.qty) > 0);
      if (!take.length) return bad('Escriba al menos una cantidad recibida.');
      for (const r of rows) { const q = Number(r.qty || 0); if (isNaN(q) || q < 0) return bad(`Cantidad no válida en "${r.p.name}".`); if (q > r.pending + 1e-9) return bad(`De "${r.p.name}" solo quedan ${qfmt(r.pending)} pendientes.`); }
      for (const r of take) { if (r.cost === '' || !(Number(r.cost) >= 0)) return bad(`Escriba el costo de "${r.p.name}".`); if (r.p.trackLots && !r.lot) return bad(`"${r.p.name}" controla lotes: escriba el lote.`); }
      if (o.currency === 'USD' && !(Number(st.rate) > 0)) return bad('Escriba el tipo de cambio.');
      if (st.withInv) { if (!st.invoiceNo) return bad('Escriba el número de factura del proveedor.'); if (S.purchases.some(p => p.supplierId === o.supplierId && p.status === 'issued' && (p.invoiceNo || '').toLowerCase() === st.invoiceNo.toLowerCase())) return bad('Esa factura de este proveedor ya fue registrada.'); }
      $('#r_ok').disabled = true;
      try {
        const rate = o.currency === 'USD' ? Number(st.rate) : 1; const number = await nextNumber('receiptNext', 'RM-', 6); const createdAt = nowIso(); const mvDate = st.date === today() ? createdAt : st.date + 'T12:00:00';
        const rc = { id: uid(), number, poId: o.id, poNumber: o.number, supplierId: o.supplierId, supplierName: o.supplierName, date: st.date, currency: o.currency, rate, discountPct: o.discountPct, status: 'active', invoiceId: null, createdAt,
          lines: take.map(r => { const q = Number(r.qty); const qb = r4(q * r.l.factor); return { lineKey: r.l.key, productId: r.p.id, name: r.p.name, sku: r.p.sku, unitId: r.l.unitId, unitLabel: r.l.unitLabel, factor: r.l.factor, qty: q, qtyBase: qb, cost: r2(Number(r.cost)),
            unitCostBase: r6(Number(r.cost) / r.l.factor * (1 - o.discountPct / 100) * rate), tax: r.p.tax || 'ISV15', lots: r.p.trackLots ? [{ lot: r.lot, expiry: r.expiry || '', qty: qb }] : null, wh: st.wh || mainWh() }; }) };
        await put('receipts', rc);
        for (const l of rc.lines) await moveStock(l.productId, 'in', l.qtyBase, 'Entrada de mercadería', `${number} · ${o.number}`, l.unitCostBase, mvDate, 'Proveedor: ' + o.supplierName, { lots: l.lots, supplier: o.supplierName, receiptId: rc.id, wh: l.wh });
        const x = clone(S.purchaseOrders.find(z => z.id === o.id));
        rc.lines.forEach(l => { const ol = x.lines.find(z => z.key === l.lineKey); ol.received = r4((ol.received || 0) + l.qty); });
        x.status = poPending(x) ? 'partial' : 'received'; poHist(x, `Recepción ${number}: ${rc.lines.map(l => qfmt(l.qty) + ' ' + l.unitLabel + ' ' + l.name).join(', ')}`);
        if (x.status === 'received') poHist(x, 'Compra completada');
        await put('purchaseOrders', x);
        if (st.withInv) await invoiceFromReceipts(o.supplierId, [rc.id], { invoiceNo: st.invoiceNo, date: st.date, payType: st.payType, method: st.method });
        closeModal(); toast(`Recepción ${number} registrada${x.status === 'partial' ? ' · quedan productos pendientes' : ' · compra completada'}`); render();
      } catch (e) { toast(e.message, true); $('#r_ok').disabled = false; }
    };
  };
  draw();
}
// Factura del proveedor a partir de recepciones (no mueve inventario: ya entró en la recepción)
async function invoiceFromReceipts(sid, receiptIds, { invoiceNo, date, payType, method }) {
  const s = S.suppliers.get(sid); const recs = receiptIds.map(id => S.receipts.find(r => r.id === id));
  const lines = []; let gross = 0, disc = 0, tax = 0;
  for (const rc of recs) for (const l of rc.lines) {
    const g = l.qty * l.cost * rc.rate; const net = g * (1 - rc.discountPct / 100); const tr = (TAXES[l.tax] || TAXES.ISV15).rate;
    gross += g; disc += g - net; tax += net * tr;
    lines.push({ productId: l.productId, name: l.name, sku: l.sku, unitId: l.unitId, unitLabel: l.unitLabel, factor: l.factor, qty: l.qty, qtyBase: l.qtyBase, cost: l.cost, unitCostBase: l.unitCostBase, tax: l.tax, taxAmount: r2(net * tr), net: r2(net), total: r2(net * (1 + tr)), lots: l.lots, receiptId: rc.id, wh: l.wh });
  }
  const total = r2(gross - disc + tax); const credit = payType === 'credit'; const number = await nextNumber('purchaseNext', 'COM-', 6);
  const cur = recs[0].currency; const rate = recs[0].rate;
  const pu = { id: uid(), number, supplierId: sid, supplierName: s.name, supplierRtn: s.rtn || '', invoiceNo, date, dueDate: credit ? addDays(date, Number(s.creditDays || 0)) : null, payType, method: credit ? null : method,
    currency: cur, rate, discountPct: recs[0].discountPct, lines, subtotal: r2(gross), discount: r2(disc), tax: r2(tax), total, totalCurrency: r2(total / (rate || 1)),
    balance: credit ? total : 0, paidAtPurchase: credit ? 0 : total, status: 'issued', createdAt: nowIso(), stockMoved: false, receiptIds, poIds: [...new Set(recs.map(r => r.poId).filter(Boolean))] };
  await applySupplierCredit(pu);
  await put('purchases', pu);
  for (const rc of recs) { const r = clone(S.receipts.find(z => z.id === rc.id)); r.invoiceId = pu.id; await put('receipts', r); }
  for (const poId of pu.poIds) { const x = clone(S.purchaseOrders.find(z => z.id === poId)); if (x) { poHist(x, `Factura ${invoiceNo} registrada (${pu.number}, ${L(total)})`); await put('purchaseOrders', x); } }
  return pu;
}
function showReceipt(id) {
  const r = S.receipts.find(x => x.id === id); if (!r) return;
  const inv = r.invoiceId ? S.purchases.find(p => p.id === r.invoiceId) : null;
  openModal(`<div class="mh"><h2>Recepción ${esc(r.number)}</h2><button class="x" data-close>×</button></div>
  <div class="mbody"><div class="sub" style="margin-bottom:10px">${esc(r.supplierName)} · ${dOnly(r.date)}${r.poNumber ? ' · orden ' + esc(r.poNumber) : ''}</div>
    ${r.status === 'voided' ? `<div class="banner" style="margin:0 0 10px">Anulada: ${esc(r.voidReason || '')}</div>` : ''}
    <table><thead><tr><th>Producto</th><th class="num">Cantidad</th><th class="num">Costo unit. inventario</th></tr></thead><tbody>${r.lines.map(l => `<tr><td><b>${esc(l.name)}</b>${l.lots ? `<div class="muted" style="font-size:12px">Lote ${esc(l.lots[0].lot)}${l.lots[0].expiry ? ' · vence ' + dOnly(l.lots[0].expiry) : ''}</div>` : ''}</td><td class="num">${qfmt(l.qty)} ${esc(l.unitLabel)}</td><td class="num">${L(l.unitCostBase)}</td></tr>`).join('')}</tbody></table>
    <p class="sub">${inv ? `Facturada: ${esc(inv.number)} · factura ${esc(inv.invoiceNo || 's/n')}` : r.status === 'active' ? 'Sin factura del proveedor todavía.' : ''}</p></div>
  <div class="mf">${r.status === 'active' && !inv ? '<button class="btn d" id="rVoid">Anular recepción</button><button class="btn" id="rInv">Registrar factura</button>' : ''}<button class="btn" data-close>Cerrar</button></div>`);
  bindClose();
  const v = $('#rVoid'); if (v) v.onclick = () => voidReceipt(id);
  const i = $('#rInv'); if (i) i.onclick = () => invoiceFromReceiptsForm(r.supplierId, [id]);
}
function voidReceipt(id) {
  const r = S.receipts.find(x => x.id === id);
  if (r.invoiceId) return toast('La recepción ya está facturada; anule primero la factura.', true);
  if (!S.config.allowNegative) for (const l of r.lines) if (whStock(l.productId, l.wh || mainWh()) < l.qtyBase) return toast(`No hay existencia suficiente de "${l.name}" en ${l.wh || mainWh()} para sacarla (hay ${qfmt(whStock(l.productId, l.wh || mainWh()))}).`, true);
  confirmBox('Anular ' + r.number, 'La mercadería sale del inventario y vuelve a quedar pendiente en la orden.', 'Anular recepción', async (reason) => {
    const x = clone(r); x.status = 'voided'; x.voidReason = reason; await put('receipts', x);
    for (const l of r.lines) await moveStock(l.productId, 'out', l.qtyBase, 'Anulación de recepción', r.number, l.unitCostBase, nowIso(), reason, { lots: l.lots, supplier: r.supplierName, receiptId: r.id, wh: l.wh });
    if (r.poId) { const o = clone(S.purchaseOrders.find(z => z.id === r.poId)); r.lines.forEach(l => { const ol = o.lines.find(z => z.key === l.lineKey); if (ol) ol.received = r4(Math.max(0, (ol.received || 0) - l.qty)); });
      if (o.status !== 'cancelled') { o.status = o.lines.some(l => l.received > 0) ? 'partial' : 'approved'; o.closedShort = false; } poHist(o, `Recepción ${r.number} anulada: ${reason}`); await put('purchaseOrders', o); }
    toast('Recepción anulada'); render();
  }, true);
}

/* ------------------------------ Registrar factura ------------------------------ */

function invoiceFromReceiptsForm(sid, preIds) {
  const pend = S.receipts.filter(r => r.status === 'active' && !r.invoiceId);
  const sups = [...new Set(pend.map(r => r.supplierId))].map(id => S.suppliers.get(id)).filter(Boolean);
  if (!sups.length) return toast('No hay recepciones sin factura.', true);
  const st = { sid: sid && sups.some(s => s.id === sid) ? sid : sups[0].id, sel: new Set(preIds), invoiceNo: '', date: today() };
  const init = () => { const s = S.suppliers.get(st.sid); st.payType = s.paymentMethod === 'credit' || s.creditDays > 0 ? 'credit' : 'cash'; st.method = s.paymentMethod === 'credit' ? 'transfer' : (s.paymentMethod || 'cash'); };
  init();
  const draw = () => {
    const mine = pend.filter(r => r.supplierId === st.sid); if (!preIds.length && !st.sel.size) mine.forEach(r => st.sel.add(r.id));
    const val = (r) => r.lines.reduce((a, l) => { const net = l.qty * l.cost * r.rate * (1 - r.discountPct / 100); return a + net * (1 + (TAXES[l.tax] || TAXES.ISV15).rate); }, 0);
    const tot = r2(mine.filter(r => st.sel.has(r.id)).reduce((a, r) => a + val(r), 0)); const s = S.suppliers.get(st.sid);
    openModal(`<div class="mh"><h2>Factura de mercadería recibida</h2><button class="x" data-close>×</button></div>
    <div class="mbody"><div class="form"><div style="grid-column:span 2"><label class="f">Proveedor</label><select class="in" id="f_sup">${sups.map(x => `<option value="${x.id}" ${x.id === st.sid ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div></div>

        for (const l of lines) await moveStock(l.productId, 'out', l.qtyBase, 'Devolución a proveedor', `${number} · ${pu.number}`, l.unitCostBase, createdAt, st.reason + (st.note ? ': ' + st.note : ''), { lots: l.lots, supplier: pu.supplierName, wh: l.wh });
        closeModal(); toast(`Devolución ${number} registrada${doc.unapplied > 0 ? ' · saldo a favor ' + L(doc.unapplied) : ''}`); render();
      } catch (e) { toast(e.message, true); $('#d_ok').disabled = false; }
    };
  };
  draw();
}

const SELLER_STATUS = { active: ['Activo', 'g'], inactive: ['Inactivo', 'n'], suspended: ['Suspendido', 'y'] };
const DAYS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const cfgSellers = () => S.config.sellers || [];

const sellerStatus = (s) => s.status || (s.active === false ? 'inactive' : 'active');
async function hashPin(pin, salt) { const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin)); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join(''); }
const monthOf = (iso) => dayKey(iso).slice(0, 7);
const MONTHS_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const monthName = (m) => MONTHS_L[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(0, 4);
const lastMonths = (n) => { const out = []; let d = today().slice(0, 7) + '-15'; for (let i = 0; i < n; i++) { out.push(d.slice(0, 7)); d = addDays(d.slice(0, 7) + '-01', -1).slice(0, 7) + '-15'; } return out; };
function sellerMonth(sid, month) {
  const sales = S.sales.filter(s => s.status === 'issued' && s.sellerId === sid && monthOf(s.createdAt) === month);
  const ids = new Set(sales.map(s => s.id)); const base = sales.reduce((a, s) => a + s.subtotal, 0);
  const ret = S.customerReturns.filter(r => ids.has(r.saleId)).reduce((a, r) => { const s = S.sales.find(x => x.id === r.saleId); return a + r.lines.reduce((x, l) => x + splitTax(l.amount, (s.lines[l.lineIdx] || {}).tax || 'ISV15').base, 0); }, 0);
  const s = sellerById(sid) || {}; const net = r2(base - ret); const rate = Number(s.commission || 0); const goal = Number(s.monthlyGoal || 0);
  return { sales, count: sales.length, total: r2(sales.reduce((a, x) => a + x.total, 0)), net, rate, commission: r2(net * rate / 100), goal, pct: goal ? Math.round(net / goal * 100) : null };
}
const sellerCustomers = (sid) => [...S.customers.values()].filter(c => c.sellerId === sid && !c.walkIn).sort((a, b) => a.name.localeCompare(b.name));
const routeToday = (s) => { const d = new Date(today() + 'T12:00:00').getDay(); return sellerCustomers(s.id).filter(c => ((s.routePlan || {})[c.id] || []).includes(d)); };

/* ------------------------------ Pedidos: cálculo y validación ------------------------------ */
const ORDER_STATUS = { pending: ['Pendiente · Recibido', 'y'], approved: ['Aprobado · Validado', 'b'], preparing: ['En preparación', 'b'], prepared: ['Preparado', 'b'], dispatched: ['Despachado', 'b'], invoiced: ['Facturado', 'g'], delivered: ['Entregado', 'g'], partial: ['Entrega parcial · saldo pendiente', 'y'], cancelled: ['Cancelado', 'n'], rejected: ['Rechazado', 'r'] };
const ORDER_FLOW = ['pending', 'approved', 'preparing', 'prepared', 'dispatched', 'invoiced', 'delivered'];
const ORDER_STEP = { pending: 'Pendiente', approved: 'Aprobado', preparing: 'En preparación', prepared: 'Preparado', dispatched: 'Despachado', invoiced: 'Facturado', delivered: 'Entregado' };
const SOURCES = { app: 'App del vendedor', phone: 'Teléfono', whatsapp: 'WhatsApp', office: 'Oficina' };
const PAY_PROP = { cash: 'Contado (efectivo)', transfer: 'Transferencia', credit: 'Crédito' };
const orderPill = (o) => { const [n, t] = ORDER_STATUS[o.status]; return `<span class="pill ${t}">${n}${o.status === 'delivered' && o.closedShort ? ' con faltante' : ''}</span>`; };
const allowedDisc = (p, c) => Math.max(Number(p.maxDiscount || 0), Number((c && c.maxDiscount) || 0));
function orderTotals(lines) {
  let gross = 0, total = 0, tax = 0;
  for (const l of lines) { const q = Number(l.qty) || 0; gross += q * l.listPrice; const lt = r2(q * l.price); total += lt; tax += splitTax(lt, l.tax).tax; }
  return { gross: r2(gross), discount: r2(gross - total), tax: r2(tax), base: r2(total - tax), total: r2(total) };
}
// Precio de lista por línea (lista del cliente, escala y promoción) y precio autorizado con el descuento pedido
function priceLines(lines, customer) {
  const qty = new Map(); lines.forEach(l => { const p = S.products.get(l.productId); if (p) qty.set(p.id, r4((qty.get(p.id) || 0) + (Number(l.qty) || 0) * unitById(p, l.unitId).factor)); });
  return lines.map(l => { const p = S.products.get(l.productId); const u = unitById(p, l.unitId); const info = priceInfo(p, u, customer, qty.get(p.id) || 0); const d = Math.min(100, Math.max(0, Number(l.discountPct) || 0));
    return { ...l, name: p.name, sku: p.sku, unitLabel: u.label, factor: u.factor, tax: p.tax || 'ISV15', listPrice: info.price, priceSource: info.source, discountPct: d, price: r2(info.price * (1 - d / 100)), allowed: allowedDisc(p, customer) }; });
}
function orderChecks(o) {
  const c = S.customers.get(o.customerId); const out = [];
  const cst = c ? custStatus(c) : 'inactive';
  out.push({ k: 'customer', label: 'Cliente', ok: cst === 'active' || cst === 'blocked' && o.payment !== 'credit', msg: !c ? 'Cliente no encontrado' : cst === 'pending' ? 'El cliente está por aprobar' : cst === 'active' ? 'Activo' : STATUSES[cst][0] });
  const overs = o.lines.filter(l => l.discountPct > (l.allowed || 0) + 1e-9);
  out.push({ k: 'price', label: 'Precio', ok: !overs.length, msg: overs.length ? overs.map(l => `${l.name}: ${l.discountPct} % de descuento (permitido ${l.allowed || 0} %)`).join('; ') : 'Precios y descuentos dentro de lo autorizado' });
  if (o.payment === 'credit') {
    const bal = c ? customerBalance(c.id) : 0; const avail = c ? r2(Number(c.creditLimit || 0) - bal) : 0;
    const ok = !!c && c.creditEnabled && cst !== 'blocked' && avail >= o.total - 0.004;
    out.push({ k: 'credit', label: 'Crédito', ok, msg: !c || !c.creditEnabled ? 'El cliente no tiene crédito habilitado' : cst === 'blocked' ? 'Crédito bloqueado' : `Disponible ${L(avail)} · pedido ${L(o.total)}` });
  } else out.push({ k: 'credit', label: 'Crédito', ok: true, msg: 'Pago de contado: no usa crédito' });
  const need = new Map(); o.lines.forEach(l => { const p = S.products.get(l.productId); if (p && p.kind !== 'service') need.set(l.productId, r4((need.get(l.productId) || 0) + l.qty * l.factor)); });
  const short = [...need].filter(([pid, q]) => availableOf(pid, o.wh, o.customerId) < q - 1e-9);
  out.push({ k: 'stock', label: 'Disponibilidad', ok: !short.length, msg: short.length ? short.map(([pid, q]) => `${S.products.get(pid).name}: pide ${qfmt(q)}, hay ${qfmt(Math.max(0, availableOf(pid, o.wh, o.customerId)))} en ${o.wh}`).join('; ') : `Todo disponible en ${o.wh}` });
  return out;
}
const ordHist = (o, status, note) => { o.history = [...(o.history || []), { at: nowIso(), status, by: o._by || USER_NAME(), note: note || '' }]; delete o._by; };

/* ------------------------------ Sin internet: bandeja de salida ------------------------------ */
const OUTBOX_KEY = 'cc_outbox_v1';
const outbox = () => { try { return JSON.parse(LS.getItem(OUTBOX_KEY)) || []; } catch { return []; } };
const setOutbox = (a) => { try { LS.setItem(OUTBOX_KEY, JSON.stringify(a)); } catch { /* sin espacio */ } };
const isOffline = () => navigator.onLine === false;
let flushing = false;
async function finalizeOrder(o) {
  o.number = await nextNumber('orderNext', 'PED-', 6); o.syncedAt = nowIso(); delete o.pendingSync; await put('orders', o);
  const s = o.source === 'app' && sellerById(o.sellerId);
  if (s && s.autoApproveOrders) {
    const bad = orderChecks(o).filter(c => !c.ok);
    if (!bad.length) { const x = await approveOrderCore(o, 'Aprobado automáticamente (permiso del vendedor): precio, crédito y disponibilidad validados', '', 'Aprobación automática'); Object.assign(o, x); }
    else { const x = clone(S.orders.find(z => z.id === o.id)); ordHist(x, 'pending', 'No se aprobó automáticamente: ' + bad.map(c => c.label + ' — ' + c.msg).join('; ')); await put('orders', x); Object.assign(o, x); }
  }
}
async function finalizeCustomer(c) {
  c.code = await nextNumber('customerNext', 'CLI-', 5); delete c.pendingSync;
  const s = sellerById(c.registeredBy); if (s && s.autoApproveCustomers && c.status === 'pending') { c.status = 'active'; c.statusReason = ''; c.approvedAt = nowIso(); c.autoApproved = true; }
  await put('customers', c);
}
// Venta directa desde la app: sale de la bodega del vendedor. Sin conexión queda pendiente; si al sincronizar no se puede emitir, pasa a pedido por aprobar
async function finalizeDirectSale(o) {
  const cart = o.lines.map(l => ({ key: uid(), productId: l.productId, unitId: l.unitId, qty: l.qty, price: l.price, tax: l.tax, manual: true, source: 'Venta directa' + (l.discountPct ? ` · desc. ${l.discountPct} %` : '') }));
  try { const sale = await createSale(o.docKind, o.customerId, cart, [{ method: o.payment, amount: o.total }], null, { wh: o.wh, sellerId: o.sellerId }); const s2 = clone(S.sales.find(z => z.id === sale.id)); s2.directSale = true; s2.createdOffline = !!o.offlineAt; await put('sales', s2); return { sale };
  } catch (e) { if (!o.offlineAt) throw e; o.notes = [o.notes, 'Venta directa hecha sin conexión que no se pudo emitir al sincronizar: ' + e.message].filter(Boolean).join(' · '); delete o.direct; await finalizeOrder(o); return { order: o }; }
}
async function queueOrSave(kind, doc) {
  if (isOffline()) { doc.pendingSync = true; if (kind === 'sale') doc.offlineAt = nowIso(); setOutbox([...outbox(), { kind, doc }]); return false; }
  try { if (kind === 'order') await finalizeOrder(doc); else if (kind === 'customer') await finalizeCustomer(doc); else if (kind === 'sale') return await finalizeDirectSale(doc); else await put('visits', doc); return true; }
  catch (e) { if (kind === 'sale') throw e;  // con conexión, el vendedor ve el motivo (existencia, crédito…) y corrige
    doc.pendingSync = true; setOutbox([...outbox(), { kind, doc }]); return false; }
}
async function flushOutbox() {
  if (flushing || isOffline() || !S.ready || !S.config) return; const q = outbox(); if (!q.length) return;
  flushing = true; let sent = 0;
  try {
    while (outbox().length) {
      const [it, ...rest] = outbox();
      if (it.kind === 'order') await finalizeOrder(it.doc); else if (it.kind === 'customer') await finalizeCustomer(it.doc); else if (it.kind === 'sale') await finalizeDirectSale(it.doc); else await put('visits', it.doc);
      setOutbox(rest); sent++;
    }
  } catch (e) { /* se reintenta luego */ }
  flushing = false; if (sent) { toast(`${sent} registro(s) sincronizados`); render(); }
}
window.addEventListener('online', () => flushOutbox());
setInterval(() => flushOutbox(), 15000);

  };

}

async function releaseOrderReservations(o, why) {

// Aprueba el pedido y reserva la mercadería (lo usan la oficina y la aprobación automática del vendedor)
async function approveOrderCore(o, note, override, by) {
  const x = clone(o); x.reservationIds = [];
  for (const l of x.lines) { const p = S.products.get(l.productId); if (!p || p.kind === 'service') continue;
    const q = r4(Math.min(l.qty * l.factor, Math.max(0, availableOf(p.id, x.wh))));  // existencia menos todo lo ya reservado
    if (q <= 0) continue;
    const rid = uid(); const n = await nextNumber('reservationNext', 'RES-', 6);
    await put('reservations', { id: rid, number: n, productId: p.id, productName: p.name, wh: x.wh, qtyBase: q, deliveredBase: 0, customerId: x.customerId, customerName: x.customerName, ref: x.number, orderId: x.id, dueDate: x.deliveryDate, status: 'active', user: by || USER_NAME(), createdAt: nowIso(), events: [{ at: nowIso(), what: `Reserva por pedido ${x.number}: ${qfmt(q)}` }] });
    x.reservationIds.push(rid); }
  x.approvedAt = nowIso(); x.status = 'approved'; if (by) x._by = by; ordHist(x, 'approved', note); if (override) x.override = override;
  await put('orders', x); return x;
}

/* ============================ 9. BODEGA Y DESPACHO ============================ */
// Un pedido puede salir en varios despachos. Una entrega parcial NO cierra el pedido: lo que falta vuelve a "por preparar"
// hasta que se entregue o la oficina lo cierre con faltante.
const DSP_STATUS = { in_route: ['En ruta · pendiente de entrega', 'b'], delivered: ['Entregado', 'g'], partial: ['Entrega parcial', 'y'], returned: ['No entregado', 'r'] };
const REJECT_REASONS = ['Producto dañado', 'El cliente no lo pidió', 'Producto vencido', 'Cliente sin dinero', 'Negocio cerrado', 'Otro'];
const dspPill = (d) => { const [n, t] = DSP_STATUS[d.status]; return `<span class="pill ${t}">${n}</span>`; };
// Pendiente de una línea = pedido − despachado + rechazado en la entrega (lo rechazado vuelve a estar pendiente)
const lnPending = (l) => r4(Math.max(0, l.qty - (l.dispatched || 0) + (l.rejected || 0)));
const lnTransit = (l) => r4((l.dispatched || 0) - (l.delivered || 0) - (l.rejected || 0));
const orderOpen = (o) => o.lines.some(l => lnPending(l) > 1e-9);
async function resizeImage(file, max, q) {
  const url = URL.createObjectURL(file);
  try { const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('imagen no válida')); i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height); return cv.toDataURL('image/jpeg', q || 0.6);
  } finally { URL.revokeObjectURL(url); }
}

function startPicking(orderId) {
  const o = S.orders.find(x => x.id === orderId);
  if (o.status === 'preparing') { location.hash = 'preparar-' + orderId; return; }
  if (!['approved', 'partial'].includes(o.status)) return toast('Este pedido no está para preparar.', true);
  openModal(`<div class="mh"><h2>Preparar ${esc(o.number)}</h2><button class="x" data-close>×</button></div>
  <div class="mbody"><label class="f">Responsable de bodega *</label><input class="in" id="pkBy" value="${esc(S.config.lastWhResp || '')}" placeholder="Quién prepara"></div>
  <div class="mf"><button class="btn" data-close>Cancelar</button><button class="btn p" id="pkGo">Abrir hoja de preparación</button></div>`, true);
  bindClose();
  $('#pkGo').onclick = async () => {
    const by = $('#pkBy').value.trim(); if (by.length < 3) return toast('Escriba el nombre del responsable.', true);

function sigPad(canvas) {

  canvas.onpointerdown = (e) => { drawing = true; canvas.setPointerCapture(e.pointerId); const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(x, y); };
  canvas.onpointermove = (e) => { if (!drawing) return; const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); dirty = true; };
  canvas.onpointerup = canvas.onpointercancel = () => { drawing = false; };
  return { clear: () => { ctx.setTransform(1, 0, 0, 1, 0, 0); fit(); dirty = false; }, isEmpty: () => !dirty, data: () => canvas.toDataURL('image/png') };
}

// Lo que el cliente no recibió vuelve a la bodega como devolución de cliente (se descuenta de su saldo o se le devuelve)
async function returnFromDispatch(d, rej) {
  const s = S.sales.find(x => x.id === d.saleId); const n = await nextNumber('custReturnNext', 'DVC-', 6); const at = nowIso();
  const used = new Set(); const lines = rej.map(r => { const idx = s.lines.findIndex((sl, i) => !used.has(i) && !sl.gift && sl.productId === r.l.productId && (sl.unitId ? sl.unitId === r.l.unitId : sl.unitLabel === r.l.unitLabel));
    if (idx < 0) throw new Error(`No se encontró "${r.l.name}" en el documento de la venta.`); used.add(idx); const sl = s.lines[idx];
    return { lineIdx: idx, productId: r.l.productId, name: r.l.name, unitLabel: r.l.unitLabel, factor: r.l.factor, qty: r.rejected, qtyBase: r4(r.rejected * r.l.factor), amount: r2(r.rejected * sl.total / sl.qty), unitCost: sl.unitCost, lots: (sl.lots || []).filter(x => x.lot !== 'SIN-LOTE') }; });
  const total = r2(lines.reduce((a, l) => a + l.amount, 0)); const s2 = clone(s); const applied = r2(Math.min(total, s2.balance || 0));
  lines.forEach(l => { s2.lines[l.lineIdx].returned = r4((s2.lines[l.lineIdx].returned || 0) + l.qty); }); s2.balance = r2((s2.balance || 0) - applied);
  const reason = [...new Set(rej.map(r => r.reason))].join(', ');
  const doc = { id: uid(), number: n, saleId: s.id, saleNumber: s.number, saleKind: s.kind, customerId: s.customerId, customerName: s.customerName, date: today(), wh: d.wh, reason, note: 'No recibido en la entrega ' + d.number, condition: 'good', lines, total,
    appliedToBalance: applied, refunded: r2(total - applied), refundMethod: total - applied > 0 ? 'cash' : null, user: d.carrier, createdAt: at, dispatchId: d.id, dispatchNumber: d.number };
  doc.taxes = returnTaxes(s, lines); try { doc.creditNote = await creditNoteFor(s); } catch (e) { doc.creditNotePending = e.message; }
  await put('customerReturns', doc); await put('sales', s2);
  for (const l of lines) await moveStock(l.productId, 'in', l.qtyBase, 'Devolución de cliente', `${n} · ${d.number}`, l.unitCost, at, reason + ' (no recibido en la entrega)', { wh: d.wh, lots: l.lots, customerId: s.customerId, saleId: s.id });
  return doc;
}

/* ============================ 10.3 CAJA ============================ */
// Cada cajero abre su propia sesión en su dispositivo. Ventas, cobros, ingresos, egresos y devoluciones en efectivo
// quedan ligados a la sesión, y al cierre se compara el efectivo contado contra el esperado.
const CASH_KEY = 'cc_cash_session';
const DENOMS = [500, 200, 100, 50, 20, 10, 5, 2, 1, 0.5, 0.2, 0.1];
const curSession = () => { try { const id = LS.getItem(CASH_KEY); const s = id && S.cashSessions.find(x => x.id === id); return s && s.status === 'open' ? s : null; } catch { return null; } };
const sessionSales = (sid) => S.sales.filter(s => s.sessionId === sid);
function sessionSummary(cs) {
  const sales = sessionSales(cs.id); const issued = sales.filter(s => s.status === 'issued');
  const byMethod = {}; issued.forEach(s => s.tenders.forEach(t => { byMethod[t.method] = r2((byMethod[t.method] || 0) + t.amount); }));
  const pays = S.payments.filter(p => p.sessionId === cs.id); const payBy = {}; pays.forEach(p => { payBy[p.method] = r2((payBy[p.method] || 0) + p.amount); });
  const refunds = S.customerReturns.filter(r => r.sessionId === cs.id && r.refundMethod === 'cash');
  const ncCash = S.notes.filter(n => n.type === 'credit' && n.status === 'issued' && n.sessionId === cs.id && n.refundMethod === 'cash').reduce((a, n) => a + (n.refunded || 0), 0);
  const refundCash = r2(ncCash + refunds.reduce((a, r) => a + (r.refunded || 0), 0) + S.customerReturns.reduce((a, r) => a + (r.changeRefunds || []).filter(x => x.sessionId === cs.id).reduce((b, x) => b + x.amount, 0), 0));
  const ins = r2((cs.moves || []).filter(m => m.type === 'in').reduce((a, m) => a + m.amount, 0)); const outs = r2((cs.moves || []).filter(m => m.type === 'out').reduce((a, m) => a + m.amount, 0));
  const expected = r2(cs.openingFund + (byMethod.cash || 0) + (payBy.cash || 0) + ins - outs - refundCash);
  return { sales, issued, voided: sales.filter(s => s.status === 'voided'), byMethod, pays, payBy, refunds, refundCash, ins, outs, expected,
    total: r2(issued.reduce((a, s) => a + s.total, 0)), internal: issued.filter(s => s.kind === 'internal'), fiscal: issued.filter(s => s.kind === 'fiscal') };
}

const STATUSES = { active: ['Activo', 'g'], pending: ['Por aprobar', 'y'], inactive: ['Inactivo', 'n'], suspended: ['Suspendido', 'y'], blocked: ['Bloqueado por crédito', 'r'] };
const USUAL_PAY = { cash: 'Efectivo', transfer: 'Transferencia', card: 'Tarjeta', credit: 'Crédito' };

// Compatibilidad con clientes creados en la versión anterior
function custStatus(c) { return c.status || (c.blocked ? 'blocked' : 'active'); }
function statusPill(c) { const [n, t] = STATUSES[custStatus(c)] || STATUSES.active; return `<span class="pill ${t}">${n}</span>`; }
function sellerName(id) { const s = (S.config.sellers || []).find(x => x.id === id); return s ? s.name : ''; }
function openingDue(c) { return c.openingBalance > 0 ? (c.openingDue || (c.createdAt || nowIso()).slice(0, 10)) : null; }

// Partidas pendientes de cobro: ventas al crédito + saldo inicial
function openItems(cid) {
  const items = S.sales.filter(s => s.status === 'issued' && s.balance > 0 && (!cid || s.customerId === cid))
    .map(s => ({ id: s.id, customerId: s.customerId, number: s.number, balance: s.balance, dueDate: s.dueDate, createdAt: s.createdAt, opening: false }));
  S.notes.filter(n => n.type === 'debit' && n.status === 'issued' && n.balance > 0 && (!cid || n.customerId === cid))
    .forEach(n => items.push({ id: n.id, customerId: n.customerId, number: n.number, balance: n.balance, dueDate: n.dueDate, createdAt: n.createdAt, opening: false, note: true }));
  for (const c of S.customers.values()) {
    if (cid && c.id !== cid) continue;
    const rest = r2(Number(c.openingBalance || 0) - Number(c.openingPaid || 0));
    if (rest > 0) items.push({ id: 'opening', customerId: c.id, number: 'Saldo inicial', balance: rest, dueDate: openingDue(c), createdAt: c.createdAt || nowIso(), opening: true });
  }
  return items.sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
}
customerBalance = function (cid) { return r2(openItems(cid).reduce((a, i) => a + i.balance, 0)); };
function customerStats(cid) {
  const sales = S.sales.filter(s => s.customerId === cid && s.status === 'issued');
  const total = r2(sales.reduce((a, s) => a + s.total, 0));
  const last = sales.reduce((m, s) => (!m || s.createdAt > m ? s.createdAt : m), null);
  const t = today();
  const overdue = r2(openItems(cid).filter(i => i.dueDate && i.dueDate < t).reduce((a, i) => a + i.balance, 0));
  return { count: sales.length, total, last, avg: sales.length ? r2(total / sales.length) : 0, overdue };
}

      <div><label class="f">Colonia o barrio</label><input class="in" id="c_nb" value="${esc(c.neighborhood)}"></div>

      <div style="grid-column:1/-1"><label class="f">Referencia de ubicación</label><input class="in" id="c_ref" value="${esc(c.reference)}" placeholder="Frente a la iglesia, portón verde…"></div>
      <div><label class="f">Latitud (opcional)</label><input class="in" id="c_lat" value="${esc(c.lat)}" inputmode="decimal" placeholder="14.0723"></div>

    <div class="sec">F. Estado del cliente</div>
    <div class="form"><div><label class="f">Estado</label><select class="in" id="c_st">${opt(Object.entries(STATUSES).map(([k, [n]]) => [k, n]), c.status)}</select></div>

    <div class="form" style="margin-top:8px"><div><label class="f">N.º constancia de registro de exonerado</label><input class="in" id="c_exoc" value="${esc(c.exoConstancia || '')}"></div>
      <div><label class="f">N.º registro SAG</label><input class="in" id="c_exos" value="${esc(c.exoSag || '')}"></div>

  const ss = $('#c_seller'); ss.onchange = () => { $('#c_newseller').style.display = ss.value === '__new' ? 'block' : 'none'; if (ss.value === '__new') $('#c_newseller').focus(); };
  $('#c_lat').onchange = () => { const m = $('#c_lat').value.match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/); if (m) { $('#c_lat').value = m[1]; $('#c_lng').value = m[2]; } };

    const n = { ...c, personType: v('c_pt'), name: v('c_name'), legalName: v('c_legal'), rtn: v('c_rtn').replace(/\D/g, ''), dni: v('c_dni').replace(/\D/g, ''),
      phone: v('c_phone'), whatsapp: v('c_wa'), email: v('c_mail'), country: v('c_country') || 'Honduras', department: v('c_dep'), municipality: v('c_mun'),
      city: v('c_city'), neighborhood: v('c_nb'), address: v('c_addr'), reference: v('c_ref'), lat: v('c_lat'), lng: v('c_lng'),
      businessType: v('c_bt'), commercialClass: v('c_cl'), priceList: v('c_pl'), maxDiscount: r2(Number(v('c_disc').replace(',', '.')) || 0),
      usualPayment: v('c_up'), notes: v('c_notes'), updatedAt: nowIso() };

      n.creditEnabled = $('#c_cr').checked; n.creditLimit = r2(Number(v('c_lim').replace(',', '.')) || 0); n.termDays = Math.max(0, parseInt(v('c_term'), 10) || 0);
      n.status = v('c_st'); n.statusReason = v('c_str'); n.blocked = n.status === 'blocked'; n.blockReason = n.blocked ? n.statusReason : '';
      n.exonerated = $('#c_exo').checked; n.exoConstancia = v('c_exoc'); n.exoSag = v('c_exos'); n.exoUntil = v('c_exou');
      if (n.exonerated && !n.exoConstancia) return toast('Escriba el número de constancia de registro de exonerado.', true);
    }
    if (!n.name) return toast('El nombre comercial es obligatorio.', true);
    if (n.rtn && n.rtn.length !== 14) return toast('El RTN debe tener 14 dígitos.', true);
    if (n.dni && n.dni.length !== 13) return toast('La identidad debe tener 13 dígitos.', true);
    if (n.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(n.email)) return toast('El correo no es válido.', true);
    if (n.rtn && [...S.customers.values()].some(x => x.id !== n.id && x.rtn === n.rtn)) return toast('Ya existe un cliente con ese RTN.', true);
    if (n.dni && [...S.customers.values()].some(x => x.id !== n.id && x.dni === n.dni)) return toast('Ya existe un cliente con esa identidad.', true);
    if ((n.lat && isNaN(Number(n.lat))) || (n.lng && isNaN(Number(n.lng)))) return toast('Las coordenadas no son válidas.', true);
    if (n.maxDiscount < 0 || n.maxDiscount > 100) return toast('El descuento debe estar entre 0 y 100 %.', true);
    if (!walk && n.status !== 'active' && n.statusReason.length < 3) return toast('Escriba el motivo del estado del cliente.', true);
    if (!walk && n.creditEnabled && !(n.creditLimit > 0)) return toast('Defina un límite de crédito mayor que cero.', true);
    if (n.usualPayment === 'credit' && !n.creditEnabled) n.usualPayment = 'cash';
    let opening = 0;
    if (isNew && $('#c_open')) {
      opening = r2(Number(v('c_open').replace(',', '.')) || 0);
      if (opening < 0) return toast('El saldo inicial no puede ser negativo.', true);
      n.openingBalance = opening; n.openingPaid = 0; n.openingDue = v('c_opendue') || today();
    }
    $('#c_ok').disabled = true;
    try {
      const sv = $('#c_seller').value;
      if (sv === '__new') {
        const nm = v('c_newseller'); if (!nm) { $('#c_ok').disabled = false; return toast('Escriba el nombre del vendedor.', true); }
        const sid = uid(); const cfg = clone(S.config); cfg.sellers = [...(cfg.sellers || []), { id: sid, name: nm, active: true }]; await putConfig(cfg); n.sellerId = sid;
      } else n.sellerId = sv;
      if (isNew) {
        await withNumberLock(async () => { const cfg = clone(S.config); n.code = 'CLI-' + pad(cfg.customerNext || 1, 5); cfg.customerNext = (cfg.customerNext || 1) + 1; await putConfig(cfg); });
        n.createdAt = nowIso();
      }
      await put('customers', n);
      closeModal(); toast('Cliente guardado');
      if (onSaved) onSaved(n); else if (isNew) location.hash = 'cliente-' + n.id; else render();
    } catch (e) { toast(e.message, true); $('#c_ok').disabled = false; }
  };
}

function statementRows(cid) {
  const c = S.customers.get(cid); const ev = [];
  if (Number(c.openingBalance) > 0) ev.push({ date: c.createdAt || nowIso(), doc: 'Saldo inicial', detail: 'Deuda anterior al sistema', charge: r2(c.openingBalance), credit: 0 });
  S.sales.filter(s => s.customerId === cid && s.status === 'issued').forEach(s => {
    const cr = r2((s.tenders || []).filter(t => t.method === 'credit').reduce((a, t) => a + t.amount, 0));
    if (cr > 0) ev.push({ date: s.createdAt, doc: s.number, detail: (s.kind === 'fiscal' ? 'Factura' : 'Venta') + ' al crédito' + (s.dueDate ? ', vence ' + fdate(s.dueDate + 'T12:00:00') : ''), charge: cr, credit: 0 });
  });
  S.payments.filter(p => p.customerId === cid).forEach(p => ev.push({ date: p.createdAt, doc: p.number, detail: 'Abono ' + (METHODS[p.method] || '').toLowerCase(), charge: 0, credit: r2(p.amount) }));
  S.customerReturns.filter(r => r.customerId === cid && r.appliedToBalance > 0).forEach(r => ev.push({ date: r.createdAt, doc: r.number, detail: 'Devolución de ' + r.saleNumber + ' · ' + r.reason, charge: 0, credit: r.appliedToBalance }));
  S.notes.filter(n => n.customerId === cid && n.status === 'issued').forEach(n => {
    if (n.type === 'debit') ev.push({ date: n.createdAt, doc: n.number, detail: 'Nota de débito de ' + n.saleNumber + ' · ' + n.concept, charge: r2(n.total), credit: 0 });
    else if (n.applied > 0) ev.push({ date: n.createdAt, doc: n.number, detail: 'Nota de crédito de ' + n.saleNumber + ' · ' + n.concept, charge: 0, credit: r2(n.applied) });
  });
  ev.sort((a, b) => a.date.localeCompare(b.date));
  let bal = 0; ev.forEach(e => { bal = r2(bal + e.charge - e.credit); e.balance = bal; });
  return ev;
}

  <div><label class="f">Referencia</label><input class="in" id="p_ref"></div>

  <div class="mf"><button class="btn" data-close>Cancelar</button><button class="btn g" id="p_ok">Registrar abono</button></div>`, true);

  $('#p_ok').onclick = async () => {
    const amt = r2(Number($('#p_amt').value.replace(',', '.')));
    if (!(amt > 0)) return toast('Escriba un monto mayor que cero.', true);
    if (amt > customerBalance(cid) + 0.004) return toast(`El abono no puede ser mayor que el saldo (${L(customerBalance(cid))}).`, true);
    $('#p_ok').disabled = true;
    try {
      let number;
      await withNumberLock(async () => { const cfg = clone(S.config); number = 'REC-' + pad(cfg.paymentNext || 1, 8); cfg.paymentNext = (cfg.paymentNext || 1) + 1; await putConfig(cfg); });
      let rest = amt; const allocations = [];
      for (const it of openItems(cid)) {
        if (rest <= 0) break;
        const a = r2(Math.min(rest, it.balance)); rest = r2(rest - a);
        allocations.push({ saleId: it.id, number: it.number, amount: a });
      }
      const pay = { id: uid(), number, customerId: cid, customerName: c.name, amount: amt, method: $('#p_m').value, ref: $('#p_ref').value.trim(), allocations, createdAt: nowIso(), accountId: $('#p_m').value !== 'cash' && $('#p_acc') ? $('#p_acc').value : '', sessionId: curSession() ? curSession().id : null };
      await put('payments', pay);
      for (const al of allocations) {
        if (al.saleId === 'opening') { const cc = clone(S.customers.get(cid)); cc.openingPaid = r2(Number(cc.openingPaid || 0) + al.amount); await put('customers', cc); }
        else if (S.notes.some(x => x.id === al.saleId)) { const n = clone(S.notes.find(x => x.id === al.saleId)); n.balance = r2(n.balance - al.amount); await put('notes', n); }
        else { const s = clone(S.sales.find(x => x.id === al.saleId)); s.balance = r2(s.balance - al.amount); await put('sales', s); }
      }
      closeModal(); toast(`Abono ${number} registrado`); render(); showDoc(payModel(pay));
    } catch (e) { toast(e.message, true); $('#p_ok').disabled = false; }
  };
}

async function saveXlsx(filename, sheet, rows) { return saveBlob(filename, xlsxBlob(sheet, rows), 'Archivo listo'); }
async function saveBlob(filename, blob, okMsg) {
  window.__lastBlob = blob; window.__lastFile = filename;
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast(okMsg || 'Archivo listo'); }
    catch (e) { if (e && e.code !== 'declined') toast('No se pudo descargar el archivo.', true); }
    return;
  }
  // Fuera de Claude (modo local): descarga normal del navegador
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); window.__lastXlsx = blob; toast('Archivo generado'); }
  catch { toast('Este dispositivo no permite descargas.', true); }
}

function validateImport(rows) {
  const ok = [], errors = [];
  if (!rows.length) return { ok, errors: [{ row: 1, msg: 'El archivo está vacío.' }] };
  const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  const head = rows[0].map(norm);
  const col = (name) => head.indexOf(norm(name));
  const idx = {}; XL_HEAD.forEach(h => { idx[h] = col(h); });
  if (idx['Nombre comercial'] < 0) return { ok, errors: [{ row: 1, msg: 'Falta la columna "Nombre comercial". Use la plantilla.' }] };
  const existingRtn = new Set([...S.customers.values()].map(c => c.rtn).filter(Boolean));
  const existingDni = new Set([...S.customers.values()].map(c => c.dni).filter(Boolean));
  const statusBy = Object.fromEntries(Object.entries(STATUSES).map(([k, [n]]) => [norm(n), k])); statusBy[norm('Bloqueado')] = 'blocked';
  const payBy = Object.fromEntries(Object.entries(USUAL_PAY).map(([k, n]) => [norm(n), k]));
  const pick = (list, v) => list.find(x => norm(x) === norm(v)) || '';
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i]; const g = (h) => idx[h] >= 0 ? String(r[idx[h]] ?? '').trim() : '';
    if (r.every(x => String(x ?? '').trim() === '')) continue;
    const name = g('Nombre comercial'); const row = i + 1;
    if (!name) { errors.push({ row, msg: 'Falta el nombre comercial.' }); continue; }
    const rtn = g('RTN').replace(/\D/g, ''); const dni = g('Identidad').replace(/\D/g, '');
    if (rtn && rtn.length !== 14) { errors.push({ row, msg: `${name}: el RTN debe tener 14 dígitos.` }); continue; }
    if (dni && dni.length !== 13) { errors.push({ row, msg: `${name}: la identidad debe tener 13 dígitos.` }); continue; }
    if (rtn && existingRtn.has(rtn)) { errors.push({ row, msg: `${name}: ya existe un cliente con el RTN ${rtn}.` }); continue; }
    if (dni && existingDni.has(dni)) { errors.push({ row, msg: `${name}: ya existe un cliente con la identidad ${dni}.` }); continue; }
    const num = (h) => { const v = g(h).replace(/[L,\s]/g, ''); return v === '' ? 0 : Number(v); };
    const lim = num('Límite de crédito'), days = num('Días de crédito'), disc = num('Descuento %'), opening = num('Saldo inicial');
    if ([lim, days, disc, opening].some(x => isNaN(x) || x < 0)) { errors.push({ row, msg: `${name}: hay montos o días no válidos.` }); continue; }
    const credit = /^s/i.test(g('Crédito (Sí/No)')) || (lim > 0 && !g('Crédito (Sí/No)'));
    const status = statusBy[norm(g('Estado'))] || 'active';
    if (rtn) existingRtn.add(rtn); if (dni) existingDni.add(dni);
    ok.push({ id: uid(), personType: /^p/i.test(g('Tipo (Empresa/Persona)')) ? 'person' : 'company', name, legalName: g('Razón social'), rtn, dni,
      phone: g('Teléfono'), whatsapp: g('WhatsApp'), email: g('Correo'), country: 'Honduras', department: pick(DEPARTMENTS, g('Departamento')) || g('Departamento'),
      municipality: g('Municipio'), city: g('Ciudad o comunidad'), neighborhood: g('Colonia o barrio'), address: g('Dirección'), reference: g('Referencia'), lat: '', lng: '',
      businessType: pick(BUSINESS_TYPES2, g('Tipo de negocio')), commercialClass: pick(CUSTOMER_TYPES, g('Tipo de cliente')) || 'Minorista', sellerId: '', _seller: g('Vendedor'),
      priceList: g('Lista de precios') || 'General', maxDiscount: r2(Math.min(disc, 100)), creditEnabled: credit && lim > 0, creditLimit: r2(lim), termDays: Math.round(days) || 30,
      usualPayment: payBy[norm(g('Forma de pago'))] || 'cash', openingBalance: r2(opening), openingPaid: 0, openingDue: today(),
      status, statusReason: status === 'active' ? '' : 'Importado', blocked: status === 'blocked', notes: '' });
  }
  return { ok, errors };
}
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  const sep = (text.split('\n')[0].match(/;/g) || []).length > (text.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

async function readXlsx(buf) {

  const rels = xml(await get('xl/_rels/workbook.xml.rels'));

      let val = '';
      if (t === 's') val = shared[Number(v.textContent)] ?? '';
      else if (t === 'inlineStr') val = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
      else if (v) val = t === 'n' || !t ? Number(v.textContent) : v.textContent;
      arr[colIdx(c.getAttribute('r'))] = val;
    }
    out[ri] = arr;

}

/* ---- Bitácora: un documento por usuario y día ---- */
const COL_ES = { products: 'producto', customers: 'cliente', sales: 'venta', payments: 'abono', suppliers: 'proveedor', purchases: 'compra', supplierPayments: 'pago a proveedor', purchaseOrders: 'orden de compra', receipts: 'recepción', supplierReturns: 'devolución a proveedor', customerReturns: 'devolución de cliente', counts: 'conteo de inventario', orders: 'pedido', dispatches: 'despacho', cashSessions: 'caja', notes: 'nota', expenses: 'gasto', bankMoves: 'movimiento bancario', quotes: 'cotización', visits: 'visita' };
function auditDoc(col, doc, prev) {
  if (!usersOn() || !COL_ES[col] || pureView() === 'app') return;
  const ref = doc.number || doc.name || doc.code || doc.register || '';
  const verb = !prev ? 'Creó' : (doc.status === 'voided' && prev.status !== 'voided') ? 'Anuló' : (doc.status && doc.status !== prev.status) ? 'Cambió estado de' : 'Modificó';
  auditLog(`${verb} ${COL_ES[col]}${ref ? ' ' + ref : ''}${doc.status && prev && doc.status !== prev.status && doc.status !== 'voided' ? ' (' + doc.status + ')' : ''}`);
}
const AUD = { q: [], busy: false, key: '', doc: null };
function auditLog(text, u) {
  u = u || curUser(); if (!u) return;
  AUD.q.push({ at: nowIso(), u, t: String(text).slice(0, 300) }); setTimeout(auditFlush, 400);
}
async function auditFlush() {
  if (AUD.busy || !AUD.q.length) return; AUD.busy = true;
  try {
    while (AUD.q.length) {
      const e = AUD.q[0]; const day = dayKey(e.at); const base = `${day}_${e.u.id}`;
      if (!AUD.doc || !AUD.key.startsWith(base)) { AUD.key = base; AUD.doc = await auditRead(base); while (AUD.doc && (AUD.doc.entries || []).length >= 1200) { AUD.key = base + '_' + ((AUD.doc.part || 0) + 1); AUD.doc = await auditRead(AUD.key); } }
      if (!AUD.doc) AUD.doc = { id: AUD.key, day, userId: e.u.id, userName: e.u.name, part: AUD.key === base ? 0 : Number(AUD.key.split('_').pop()), entries: [] };
      if (AUD.doc.entries.length >= 1200) { AUD.doc = null; AUD.key = base + '_' + (Number((AUD.key.split('_')[2]) || 0) + 1); continue; }
      const same = (x) => dayKey(x.at) === day && x.u.id === e.u.id; const batch = AUD.q.filter(same); AUD.q = AUD.q.filter(x => !same(x));
      AUD.doc.entries.push(...batch.map(x => ({ at: x.at, t: x.t }))); AUD.doc.userName = e.u.name;
      await auditWrite(AUD.doc);
    }
  } catch (er) { /* la bitácora nunca detiene el trabajo */ }
  AUD.busy = false; if (AUD.q.length) setTimeout(auditFlush, 1500);
}
function auditLocal() { try { return JSON.parse(LS.getItem('cc_audit') || '{}'); } catch (e) { return {}; } }
async function auditRead(id) {
  if (S.mode === 'cloud') { const sn = await db.doc('audit/' + id).get(); return sn.exists ? clone(sn.data()) : null; }
  const a = auditLocal(); return a[id] ? clone(a[id]) : null;
}
async function auditWrite(d) {
  if (S.mode === 'cloud') return db.doc('audit/' + d.id).set(clone(d));
  const a = auditLocal(); a[d.id] = clone(d); const keys = Object.keys(a).sort(); while (keys.length > 400) delete a[keys.shift()];
  try { LS.setItem('cc_audit', JSON.stringify(a)); } catch (e) { }
}
async function auditDay(day) {
  if (S.mode === 'cloud') { const sn = await db.collection('audit').where('day', '==', day).get(); return sn.docs.map(d => d.data()); }
  return Object.values(auditLocal()).filter(d => d.day === day);
}

function authorizeUser(title, text, perm) {
  return new Promise(res => {
    const me = curUser(); const mine = me && canAct(perm, me); const pname = (PERM_ACTS.find(a => a[0] === perm) || [, 'esta acción'])[1].toLowerCase();
    const who = cfgUsers().filter(u => u.status !== 'inactive' && canAct(perm, u));
    if (!mine && !who.length) { toast('Ningún usuario tiene permiso para ' + pname + '. El administrador puede darlo en Usuarios y permisos.', true); return res(null); }
    openModal(`<div class="mh"><h2>${esc(title)}</h2><button class="x" data-close>×</button></div>
    <div class="mbody"><p class="sub" style="margin-top:0">${esc(text)}</p><div class="form">
      ${mine ? `<div><label class="f">Autoriza</label><input class="in" value="${esc(me.name)} (su usuario)" disabled></div>`
      : `<div><label class="f">Autoriza *</label><select class="in" id="auU">${who.map(u => `<option value="${esc(u.id)}">${esc(u.name)} · ${esc(roleOf(u).name)}</option>`).join('')}</select></div>
         <div><label class="f">PIN de quien autoriza *</label><input class="in" id="auPin" type="password" inputmode="numeric" autocomplete="off"></div>`}
      <div style="grid-column:1/-1"><label class="f">Motivo *</label><input class="in" id="auWhy"></div></div>
      ${mine ? '' : '<p class="sub">Su usuario no tiene este permiso: debe autorizar un supervisor o el administrador con su PIN.</p>'}</div>
    <div class="mf"><button class="btn" id="auNo">Cancelar</button><button class="btn p" id="auOk">Autorizar</button></div>`, true);
    $('#modal').querySelector('[data-close]').onclick = () => { closeModal(); res(null); }; $('#auNo').onclick = () => { closeModal(); res(null); };
    $('#auOk').onclick = async () => {
      const why = $('#auWhy').value.trim(); if (why.length < 3) return toast('Escriba el motivo.', true);
      let u = me;
      if (!mine) { u = who.find(x => x.id === $('#auU').value); if (!u || (await hashPin($('#auPin').value.trim(), u.pinSalt)) !== u.pinHash) return toast('PIN incorrecto.', true); }
      closeModal(); auditLog(`${title}: autorizó ${u.name}. Motivo: ${why}. ${text}`.slice(0, 300)); res({ by: u.name, reason: why, withPin: !mine, userId: u.id });
    };
  });
}

function bkCollect() {
  const data = {};
  if (SBC && SBX.company) {
    for (const [col, m] of SBX.cache) { if (col === 'audit') continue; data[col] = {}; for (const [id, d] of m) data[col][id] = d; }

    data.config = { main: clone(S.config) };
    for (const col of COLS) { const v = S[col]; const arr = v instanceof Map ? [...v.values()] : (v || []); data[col] = {}; for (const d of arr) if (d && d.id) data[col][d.id] = d; }
  }
  return data;
}
function bkFileName(ext) { const n = ((S.config && (S.config.tradeName || S.config.legalName)) || 'empresa').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase(); return `respaldo-${n}-${today()}.${ext}`; }
async function bkDownload() {

  const doc = { format: BK_FORMAT, version: 1, createdAt: nowIso(), company: { name: S.config && (S.config.tradeName || S.config.legalName), rtn: S.config && S.config.rtn }, counts, data };

}
async function bkExcel() {

    ['Clientes', [['Código', 'Nombre', 'RTN', 'Teléfono', 'Límite de crédito', 'Saldo']].concat([...S.customers.values()].filter(c => !c.walkIn).map(c => [c.code || '', c.name || '', c.rtn || '', c.phone || '', Number(c.creditLimit || 0), Number(customerBalance(c.id) || 0)]))],
    ['Cobros', [['Fecha', 'Cliente', 'Monto', 'Forma de pago', 'Referencia']].concat(S.payments.map(p => [fdate(p.date || p.createdAt), p.customerName || cust(p.customerId), Number(p.amount || 0), p.method || '', p.reference || p.ref || '']))],
    ['Compras', [['Número', 'Fecha', 'Proveedor', 'Factura', 'Total', 'Estado']].concat(S.purchases.map(p => [p.number || '', fdate(p.date || p.createdAt), p.supplierName || sup(p.supplierId), p.invoice || p.invoiceNumber || '', Number(p.total || 0), p.status === 'voided' ? 'Anulada' : (p.status || '')]))],
    ['Gastos', [['Número', 'Fecha', 'Categoría', 'Descripción', 'Monto', 'Estado']].concat(S.expenses.map(e => [e.number || '', fdate(e.date || e.createdAt), e.category || '', e.description || '', Number(e.amount || 0), e.status === 'voided' ? 'Anulado' : 'Registrado']))]
  ];

// Une la configuración del respaldo con la actual: conserva usuarios y PIN actuales y nunca baja un correlativo
function bkMergeConfig(cur, bak) {
  const out = clone(bak);
  for (const k of ['users', 'roles', 'recoveryHash', 'recoverySalt', 'autoLockMin']) { if (cur && cur[k] !== undefined) out[k] = clone(cur[k]); else delete out[k]; }
  const maxNext = (a, b) => { if (!a || !b || typeof a !== 'object' || typeof b !== 'object') return; for (const k of Object.keys(a)) { if (/next$/i.test(k) && typeof a[k] === 'number') b[k] = typeof b[k] === 'number' ? Math.max(a[k], b[k]) : a[k]; else if (a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) { if (!b[k] || typeof b[k] !== 'object') b[k] = clone(a[k]); else maxNext(a[k], b[k]); } } };
  maxNext(cur, out); return out;
}
async function bkRestoreFile(file) {
  if (usersOn() && !isAdminUser(curUser())) return toast('Solo el administrador puede restaurar un respaldo.', true);
  let doc; try { doc = JSON.parse(await file.text()); } catch (e) { return toast('El archivo no es un respaldo válido.', true); }
  if (!doc || doc.format !== BK_FORMAT || !doc.data) return toast('El archivo no es un respaldo de CONTROL COMERCIAL.', true);
  const names = { products: 'Productos', customers: 'Clientes', sales: 'Ventas', payments: 'Cobros', suppliers: 'Proveedores', purchases: 'Compras', expenses: 'Gastos', quotes: 'Cotizaciones', orders: 'Pedidos', movements: 'Movimientos de inventario' };
  const list = Object.entries(doc.counts || {}).filter(([c, n]) => n && names[c]).map(([c, n]) => `<li>${names[c]}: <b>${n}</b></li>`).join('');
  openModal(`<div class="mh"><h2>Restaurar respaldo</h2><button class="x" data-close>×</button></div>
  <div class="mbody"><p style="margin-top:0">Respaldo de <b>${esc((doc.company && doc.company.name) || 'empresa')}</b> del <b>${fdt(doc.createdAt)}</b>.</p><ul class="sub">${list}</ul>
  <div class="banner" style="margin:10px 0">Los registros del respaldo reemplazan a los actuales que tengan el mismo código. Lo que se registró después del respaldo no se borra. Los usuarios, PIN y correlativos de facturas actuales se conservan.</div>
  <label class="f">Para confirmar escriba <b>RESTAURAR</b></label><input class="in" id="bkConf" autocomplete="off"><div class="sub" id="bkProg" style="margin-top:8px"></div></div>
  <div class="mf"><button class="btn" data-close>Cancelar</button><button class="btn p" id="bkGo">Restaurar</button></div>`);
  bindClose();
  $('#bkGo').onclick = async () => {
    if ($('#bkConf').value.trim().toUpperCase() !== 'RESTAURAR') return toast('Escriba RESTAURAR para confirmar.', true);
    const btn = $('#bkGo'); btn.disabled = true; const prog = (t) => { const e = $('#bkProg'); if (e) e.textContent = t; };
    try { await bkApply(doc.data, prog); auditLog(`Restauró un respaldo del ${fdt(doc.createdAt)}`); closeModal(); toast('Respaldo restaurado'); render(); }
    catch (e) { btn.disabled = false; toast('No se pudo restaurar: ' + e.message, true); }
  };
}
async function bkApply(data, prog) {
  const cfg = data.config && data.config.main ? bkMergeConfig(S.config, data.config.main) : null;
  const rows = []; for (const col in data) { if (col === 'config' || col === 'audit' || !/^[A-Za-z][A-Za-z0-9_]{0,40}$/.test(col)) continue; for (const id in data[col]) rows.push([col, id, data[col][id]]); }
  if (SBC && SBX.company) {
    const all = rows.map(([col, id, d]) => ({ company_id: SBX.company.id, col, id, data: d, deleted: false }));
    if (cfg) all.unshift({ company_id: SBX.company.id, col: 'config', id: 'main', data: cfg, deleted: false });
    for (let i = 0; i < all.length; i += 300) { prog(`Guardando ${Math.min(i + 300, all.length)} de ${all.length}…`); await sbRest('docs?on_conflict=company_id,col,id', { method: 'POST', body: all.slice(i, i + 300), headers: { Prefer: 'resolution=merge-duplicates,return=minimal' } }); }
    for (const r of all) sbColMap(r.col).set(r.id, r.data); sbEmit(null);
    return;
  }
  if (S.mode === 'cloud') {
    let n = 0; if (cfg) await db.doc('config/main').set(cfg);
    for (const [col, id, d] of rows) { await db.collection(col).doc(id).set(d); if (++n % 25 === 0) prog(`Guardando ${n} de ${rows.length}…`); }
    return;
  }
  if (cfg) S.config = cfg;
  for (const [col, id, d] of rows) { if (!(col in S)) continue; if (S[col] instanceof Map) S[col].set(id, d); else { const a = S[col]; const i = a.findIndex(x => x.id === id); if (i >= 0) a[i] = d; else a.push(d); } }
  localSave();
}
